# Aggregate
# ---------------------------------------------------------------------------

[tasks."android:lint"]
description = "Format-check the Kotlin sources and run Android Lint"
run = '''
set -eu
# ktlint runs over the sources rather than through Gradle: it is the same
# binary the pre-commit hook uses, so a hook pass and a CI pass cannot
# disagree. Generated bindings are excluded by beam-android/.ktlintignore.
ktlint --relative 'beam-android/**/*.kt' '!beam-android/**/build/**'
cd beam-android && ./gradlew lintDebug
'''

[tasks."android:lint:fix"]
description = "Rewrite the Kotlin sources to satisfy ktlint"
run = "ktlint --format --relative 'beam-android/**/*.kt' '!beam-android/**/build/**'"

# The three Gradle tasks are ordered against each other for the same reason the
# pre-push hook chains them: they drive ./gradlew against one project, which
# serialises on its own lock anyway, so running them at once only contends.
[tasks."android:test"]
description = "Run the Android unit tests (JVM and Robolectric)"
wait_for = ["android:lint"]
run = "cd beam-android && ./gradlew testDebugUnitTest"

[tasks."android:screenshot"]
description = "Check the rendered screens against the recorded references"
wait_for = ["android:lint", "android:test"]
run = "cd beam-android && ./gradlew verifyRoborazziDebug"

[tasks."android:screenshot:record"]
description = "Re-record the screenshot references after an intended visual change"
run = "cd beam-android && ./gradlew recordRoborazziDebug"

[tasks."android:build"]
description = "Assemble the debug APK"
run = "cd beam-android && ./gradlew assembleDebug"

[tasks."android:release"]
description = "Assemble the release APK for every ABI"
# No explicit cross-compile step: the Gradle `cargoNdkRelease` task selects the
# release profile itself, and every ABI with it. Doing it here as well would be
# a second place for the profile to be chosen, and the two could disagree --
# which is exactly the bug that made an earlier release APK carry debug
# libraries.
run = "cd beam-android && ./gradlew assembleRelease"

# ---------------------------------------------------------------------------
# Apple client (#66, ADR-0013)
#
# Every task here begins with the same `uname` guard. Apple builds need macOS,
# and `mise run ci` has to stay runnable on Linux -- a hard failure there would
# make the aggregate task useless to anyone not on a Mac, and dropping these
# from `ci` would mean the hooks and CI no longer run the same set.
#
# The Apple toolchain is reached through `xcrun` rather than by absolute path,
# so these follow whichever Xcode `xcode-select` points at. `swift-format`
# ships inside Xcode, so there is no separate tool to pin.
# ---------------------------------------------------------------------------

[tasks."apple:project"]
description = "Generate Beam.xcodeproj and Version.xcconfig from project.yml and version.txt"
run = '''
set -eu

if [ "$(uname -s)" != "Darwin" ]; then
    echo "apple:project: skipping -- Xcode projects are only generated on macOS."
    exit 0
fi

version="$(tr -d '[:space:]' < version.txt)"

# CFBundleVersion has to increase monotonically for every build TestFlight or
# the App Store ever sees, and it is compared as a build number rather than as
# the semver in MARKETING_VERSION. Deriving it from version.txt keeps the single
# product version of ADR-0009 authoritative with nothing to bump by hand -- the
# same reason beam-android derives versionCode rather than storing it.
major="${version%%.*}"
rest="${version#*.}"
minor="${rest%%.*}"
patch="${rest#*.}"
patch="${patch%%-*}"
build="$(( major * 10000 + minor * 100 + patch ))"

cat > beam-apple/Version.xcconfig <<EOF
// Generated by \`mise run apple:project\`. Do not edit.
//
// The version comes from version.txt and the OS floor from mise.toml, so both
// have exactly one source (ADR-0009).
MARKETING_VERSION = $version
CURRENT_PROJECT_VERSION = $build
IPHONEOS_DEPLOYMENT_TARGET = $BEAM_IOS_DEPLOYMENT_TARGET
MACOSX_DEPLOYMENT_TARGET = $BEAM_MACOS_DEPLOYMENT_TARGET
EOF

cd beam-apple && xcodegen generate --quiet
'''

[tasks."apple:lint"]
description = "Format-check the Swift sources"
run = '''
set -eu

if [ "$(uname -s)" != "Darwin" ]; then
    echo "apple:lint: skipping -- swift-format ships inside Xcode."
    exit 0
fi

beam_swift_sources() {
    find beam-apple -name '*.swift' \
        -not -path '*/BeamCoreBindings/Generated/*' \
        -not -path '*/.build/*' \
        -not -path '*/Beam.xcodeproj/*'
}

# Run over the sources rather than through Xcode: it is the same binary the
# pre-commit hook uses, so a hook pass and a CI pass cannot disagree.
#
# The file list is built here rather than with `--recursive`, because
# swift-format has no exclude mechanism and the generated UniFFI bindings sit
# under Sources/BeamCoreBindings. Linting generated code produces hundreds of
# findings nobody can act on -- the next `core:bindgen:swift` would undo any
# fix -- and would bury a real one.
xcrun swift-format lint --strict --parallel $(beam_swift_sources)
'''

[tasks."apple:lint:fix"]
description = "Rewrite the Swift sources to satisfy swift-format"
run = '''
set -eu

if [ "$(uname -s)" != "Darwin" ]; then
    echo "apple:lint:fix: skipping -- swift-format ships inside Xcode."
    exit 0
fi

beam_swift_sources() {
    find beam-apple -name '*.swift' \
        -not -path '*/BeamCoreBindings/Generated/*' \
        -not -path '*/.build/*' \
        -not -path '*/Beam.xcodeproj/*'
}

xcrun swift-format format --in-place --parallel $(beam_swift_sources)
'''

[tasks."apple:test"]
description = "Run the BeamKit unit tests on macOS and the iOS simulator"
depends = ["core:apple"]
dir = "beam-apple/Packages/BeamKit"
run = '''
set -eu

if [ "$(uname -s)" != "Darwin" ]; then
    echo "apple:test: skipping -- the Apple suite needs Xcode."
    exit 0
fi

# Both destinations, because the two platforms genuinely differ: the design
# system branches on idiom and the playback engines resolve different AVKit
# types, so a suite that only ran on macOS would never have compiled the iOS
# shell. The snapshot target is skipped here and owned by `apple:snapshot`,
# which pins the one simulator its references were recorded on.
xcrun xcodebuild test \
    -scheme BeamKit \
    -destination "platform=macOS" \
    -skip-testing:SnapshotTests

xcrun xcodebuild test \
    -scheme BeamKit \
    -destination "${BEAM_IOS_DESTINATION:-platform=iOS Simulator,name=iPhone 17 Pro}" \
    -skip-testing:SnapshotTests
'''

[tasks."apple:snapshot"]
description = "Check the rendered screens against the recorded references"
depends = ["core:apple"]
# Every xcodebuild here shares one DerivedData, and two at once fail with
# "unable to attach DB ... database is locked". `mise run ci` schedules
# apple:test, apple:snapshot and apple:build together, so they are ordered
# against each other. wait_for rather than depends: it orders these only when
# they are already scheduled, so running one alone still runs only that one.
wait_for = ["apple:test"]
dir = "beam-apple/Packages/BeamKit"
run = '''
set -eu

if [ "$(uname -s)" != "Darwin" ]; then
    echo "apple:snapshot: skipping -- the snapshot tier needs an iOS simulator."
    exit 0
fi

# One pinned simulator, deliberately. Snapshot references are pixel comparisons
# and are only meaningful against a fixed idiom, scale and OS version -- the
# equivalent of beam-android pinning Robolectric to one API level.
xcrun xcodebuild test \
    -scheme BeamKit \
    -destination "${BEAM_IOS_DESTINATION:-platform=iOS Simulator,name=iPhone 17 Pro}" \
    -only-testing:SnapshotTests
'''

[tasks."apple:snapshot:record"]
description = "Re-record the snapshot references after an intended visual change"
depends = ["core:apple"]
dir = "beam-apple/Packages/BeamKit"
run = '''
set -eu

if [ "$(uname -s)" != "Darwin" ]; then
    echo "apple:snapshot:record: skipping -- the snapshot tier needs an iOS simulator."
    exit 0
fi

# A marker file, not an environment variable. A SwiftPM package test runs with
# no test host, so xcodebuild treats TEST_RUNNER_BEAM_SNAPSHOT_RECORD as a
# build setting and it never reaches the test process -- the task then verified
# the references it was asked to replace and reported success, which is the
# worst possible outcome for a task whose whole job is to rewrite them.
# Relative to this task's `dir`, which is beam-apple/Packages/BeamKit.
marker="Tests/SnapshotTests/.record"
touch "$marker"
trap 'rm -f "$marker"' EXIT

# Recording always "fails": snapshot-testing reports every reference it writes
# as a failure so a recording run cannot be mistaken for a passing one. That is
# why the status is not propagated -- but the marker is what makes the writing
# actually happen.
xcrun xcodebuild test \
    -scheme BeamKit \
    -destination "${BEAM_IOS_DESTINATION:-platform=iOS Simulator,name=iPhone 17 Pro}" \
    -only-testing:SnapshotTests || true

echo "References rewritten. Review \`git diff\` before committing them."
'''

[tasks."apple:build"]
description = "Build the iOS and macOS apps"
depends = ["apple:project", "core:apple"]
# Last of the xcodebuild tier -- see apple:snapshot for why these are ordered.
wait_for = ["apple:test", "apple:snapshot"]
run = '''
set -eu

if [ "$(uname -s)" != "Darwin" ]; then
    echo "apple:build: skipping -- the apps can only be built on macOS."
    exit 0
fi

# CODE_SIGNING_ALLOWED=NO so this needs no signing identity: CI has none, and a
# contributor should not need an Apple Developer account to check that the app
# still compiles. Producing an installable build is a release concern.
xcrun xcodebuild build \
    -project beam-apple/Beam.xcodeproj \
    -scheme "Beam (iOS)" \
    -destination "${BEAM_IOS_DESTINATION:-platform=iOS Simulator,name=iPhone 17 Pro}" \
    CODE_SIGNING_ALLOWED=NO

xcrun xcodebuild build \
    -project beam-apple/Beam.xcodeproj \
    -scheme "Beam (macOS)" \
    -destination "platform=macOS" \
    CODE_SIGNING_ALLOWED=NO
'''

# ---------------------------------------------------------------------------
# Dev stack
#
# A bare `podman compose up -d` is the bring-your-own-IdP topology -- Postgres,
# Traefik, server, web, and no identity provider -- so login is disabled with a
# clear error. That is the supported production shape (FR-101, ADR-0003), and
# the default deliberately does not ship a test IdP.
#
# The tasks below add the bundled dev Dex, which sits behind the `dev-idp`
# compose profile. The BEAM_OIDC_* values live here rather than as compose
# defaults on purpose: a profile can gate the `dex` *service*, but it cannot
# conditionally set environment on `server`, so a default would aim a
# profile-less stack at an IdP that is not running -- turning a clear "OIDC not
# configured" into a confusing discovery failure. Keeping them here also
# preserves compose.beam.yaml's list-form "unset stays unset" invariant.
#
# Ordering is sequenced in dev:up rather than with `depends_on: dex`, because a
# depends_on pointing at a profile-gated service makes the profile-less project
# invalid outright: `service "server" depends on undefined service "dex"`.
#
# Each task sources scripts/compose.sh for the provider selection and for
# `published_url`, which reads a host port back off the running stack. That is
# the one place that knows the two providers print `compose port` differently.
# ---------------------------------------------------------------------------

[tasks."dev:up"]
description = "Bring up the dev stack, including the bundled Dex IdP"
# BEAM_OIDC_ADMIN_CLAIM here is load-bearing, not a placeholder. Admin is
# derived solely from an IdP-asserted claim (FR-106), but Dex's builtin
# connector cannot emit `groups` for staticPasswords (dexidp/dex#1080, #3958),
# so there is no per-user claim to point at. `email_verified` is boolean true
# for both static users, which makes *every* dev user an admin. Acceptable for
# a dev fixture -- without it nobody can reach the admin surface at all -- and
# precisely why the bundled Dex is not a production IdP.
#
# BEAM_OIDC_ADMIN_VALUE is pinned *empty*, which the server normalises to unset
# and so requires the claim to be boolean true. Left alone, a value from a root
# `.env` would reach the container, and a set value is matched against a string
# or an array -- a boolean claim can never satisfy it -- so no dev user would be
# admin, with no warning. Empty rather than unset because shell env outranks
# `.env` for compose, and an unset variable does not.
#
# BEAM_WEB_URL is deliberately *not* set here. compose.beam.yaml already
# supplies `${BEAM_WEB_URL:-http://localhost:8080}`, and setting it from mise
# would defeat that `:-` for anyone who configured the web port in `.env`:
# shell env outranks `.env` for compose interpolation, so the redirect target
# and the CSRF allowed-origin set would both point at :8080 while the app was
# published somewhere else.
env = { BEAM_OIDC_ISSUER = "http://dex.beam.localhost:5556/dex", BEAM_OIDC_CLIENT_ID = "beam", BEAM_OIDC_CLIENT_SECRET = "beam-dev-secret", BEAM_OIDC_ADMIN_CLAIM = "email_verified", BEAM_OIDC_ADMIN_VALUE = "" }
run = '''
set -eu
. scripts/compose.sh
# Dex first, and healthy, before the server: beam-server resolves OIDC
# discovery once at startup and installs a login-disabled client if the issuer
# is unreachable, so losing this race costs a restart rather than a retry.
compose --profile dev-idp up -d --wait postgres dex
compose --profile dev-idp up -d --wait
echo
echo "Web      $(published_url web 80)"
echo "API      $(published_url server 8000)"
echo "Sign in  admin@beam.localhost / password   (also user@beam.localhost)"
'''

[tasks."dev:down"]
description = "Tear down the dev stack, including the bundled Dex IdP"
run = '''
set -eu
. scripts/compose.sh
compose --profile dev-idp down
'''

[tasks."dev:verify-oidc"]
description = "Smoke-test the containerized dev OIDC topology (needs compose)"
# Deliberately outside `ci`: it needs a container runtime, and NFR-201 says the
# default run must not. It asserts what #73 actually broke -- that one issuer
# string resolves identically from inside the server container and from the
# host -- which no workspace test can cover, because there is nothing here to
# fake. The issuer is read back out of the running container rather than
# restated, so this cannot drift from dev:up.
depends = ["dev:up"]
run = '''
set -eu
. scripts/compose.sh

status=0
check() {
    if [ "$1" -eq 0 ]; then
        echo "ok    $2"
    else
        echo "FAIL  $2" >&2
        status=1
    fi
}

issuer=$(compose exec -T server printenv BEAM_OIDC_ISSUER | tr -d '\r')
if [ -z "$issuer" ]; then
    echo "FAIL  the server container has no BEAM_OIDC_ISSUER -- start it with 'mise run dev:up'" >&2
    exit 1
fi
echo "issuer: $issuer"

# The container leg: discovery must resolve *and* self-report the same issuer.
# openidconnect compares those byte-for-byte, which is exactly the mismatch
# that made the containerized flow unusable.
# Every check below records its own failure rather than letting `set -e` abort
# the run: a smoke test that stops at the first failure hides the rest, and
# which leg broke is the whole diagnostic value here.
# stderr is deliberately not silenced: without it a DNS failure, a refused
# connection and a genuine issuer mismatch all render as the same one-line FAIL.
# `grep -F` on whitespace-stripped JSON, not `grep -E`: the issuer is data, and
# interpolating it into a regex makes `.` match any character -- so a document
# reporting `dexXbeamXlocalhost` would satisfy an ERE comparison, and an issuer
# containing `[` would make grep error rather than report a mismatch.
issuer_field() { printf '%s' "$1" | tr -d ' \t' | grep -qF "\"issuer\":\"$2\""; }

doc=$(compose exec -T server curl -fsS "$issuer/.well-known/openid-configuration" || true)
rc=0; issuer_field "$doc" "$issuer" || rc=$?
check "$rc" "discovery from inside the server container reports the configured issuer"

# The browser leg: the very same URL has to resolve from the host *and* report
# the same issuer. Asserting only reachability would pass against a host
# /etc/hosts entry pointing dex.beam.localhost at some other IdP, which is
# precisely the identity this check exists to prove.
host_doc=$(curl -fsS "$issuer/.well-known/openid-configuration" || true)
rc=0; issuer_field "$host_doc" "$issuer" || rc=$?
check "$rc" "discovery from the host reports the same issuer at the same URL"

# The flow: /v1/auth/login must hand the browser an authorize URL on that host.
# A real GET, not `curl -I`: the route is declared GET-only and kynos dispatches
# on exact method equality, so a HEAD would take the 405 branch every time and
# this check would be red against a perfectly healthy stack. `-o /dev/null -D -`
# keeps the headers and discards the body; curl does not follow the redirect
# without -L. The GET costs one pending_auths row and a state cookie.
authority=$(printf '%s' "$issuer" | sed 's|^[a-z][a-z0-9+.-]*://||; s|/.*||')
# The API base is read off the running container, not hardcoded:
# BEAM_SERVER_HOST_PORT is a documented override, and against a stack published
# anywhere but :8000 a hardcoded URL reports FAIL for a healthy server.
api_base=$(published_url server 8000)
[ -n "$api_base" ] || api_base="http://localhost:8000"
rc=0; curl -sS -o /dev/null -D - "$api_base/v1/auth/login" \
    | grep -iqF "location: $issuer" || rc=$?
check "$rc" "GET /v1/auth/login redirects to the IdP at $authority"

# The negative: the default topology stays valid and IdP-free. A `depends_on`
# naming the profile-gated dex service would break the first of these outright.
rc=0; compose config -q || rc=$?
check "$rc" "profile-less compose project is valid"
# Captured rather than piped: with no `pipefail`, a failing `compose config`
# would hand grep empty input, grep would report "no dex", and the check would
# print ok -- a false pass exactly where a regression would show up.
rc=0; services=$(compose config --services) || rc=$?
printf '%s\n' "$services" | grep -qx dex && rc=1
check "$rc" "profile-less compose project starts no IdP"

exit "$status"
'''

[tasks.ci]
description = "Run every check that CI enforces, except coverage and image builds"
depends = [
    "rust:fmt",
    "rust:clippy",
    "rust:test",
    "rust:deny",
    "rust:lockfile",
    "check:ffmpeg-version",
    "check:mutants-skip-fakes",
    "check:compose-invariants",
    "codegen:openapi:check",
    "ts:check",
    "ts:test",
    # TODO(#146): restore "ts:typecheck".
    #
    # beam-web is generated from `api.gen.ts`, which cannot be regenerated
    # until the TypeScript toolchain reads OpenAPI 3.2 (see codegen:openapi).
    # Every schema key it names was renamed by the Kynos port, so the gate
    # fails on ~55 references across 20 files -- all of them
    # `Cannot find module '@/api.gen'` in a fresh checkout. beam-web is being
    # rewritten shortly, so it is off rather than mechanically renamed twice.
    #
    # `ts:check` stays: biome excludes api.gen.ts and does not type-check.
    # `ts:test` is back: it was switched off alongside `ts:typecheck` rather
    # than for a reason of its own. vitest resolves through Vite, which does
    # not need the generated types to exist, so the suite runs on a fresh
    # checkout. It was off while over half of its suites were silently not
    # running at all (the Node >= 26 `localStorage` shadowing fixed in
    # `src/test/setup.ts`), which is exactly the state a gate exists to catch.
    # ci.yml's ts-test job and the pre-push hook in hk.pkl enforce the same.
    "docs:build",
    "android:lint",
    "android:test",
    "android:screenshot",
    # No-ops on a non-Darwin host, so `mise run ci` stays runnable on Linux
    # while a Mac runs the same set CI enforces. See the apple:* tasks above.
    "apple:lint",
    "apple:test",
    "apple:snapshot",
    "apple:build",
]
