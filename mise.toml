#:schema https://mise.jdx.dev/schema/mise.json
#
# mise is the single source of truth for beam's developer tooling and for every
# command that CI, the git hooks, and humans run. Workflows in .github/workflows
# and the hooks in hk.pkl must invoke `mise run <task>` rather than restating a
# command inline -- that duplication is what let CI and the hooks drift apart.

min_version = "2025.1.0"

[tools]
bun = "1.3.14"
hk = "1.50.0"
"github:convco/convco" = "0.7.0"
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
"github:taiki-e/cargo-llvm-cov" = "0.8.7"
# Mutation testing (ADR-0011). Advisory only -- see the `rust:mutants*` tasks and
# docs/testing.md; `ci-ok` in .github/workflows/ci.yml must never depend on them.
#
# cargo-mutants publishes prebuilt binaries for x86_64 only (linux-gnu, apple-
# darwin, pc-windows-msvc). On an aarch64 host, override in a gitignored
# mise.local.toml with `"cargo:cargo-mutants" = "27.1.0"` to build from source.
#
# `os = ["linux"]` because mise installs every tool in this table before any
# task runs, so a platform with no matching asset fails *every* job rather than
# only the ones that wanted the tool. Every runner that actually runs
# `rust:mutants:*` is ubuntu-latest (see .github/workflows/mutants.yml), and
# the advisory mutants tasks are deliberately outside `mise run ci`, so nothing
# on macOS needs this. Without the filter, the arm64 macOS runners the Apple
# jobs use fail during setup with "No matching asset found for platform
# macos-arm64" -- which is what happened the first time those jobs ran.
"github:sourcefrog/cargo-mutants" = { version = "27.1.0", os = ["linux"] }
# .cargo/mutants.toml sets `test_tool = "nextest"`, so nextest is a hard runtime
# requirement of `cargo mutants` here, not an optional speedup. nextest tags its
# releases as `cargo-nextest-<semver>`, which is the version string mise wants.
"github:nextest-rs/nextest" = "cargo-nextest-0.9.143"
# Rust is deliberately absent: rust-toolchain.toml pins 1.91.0 and is honored by
# rustup, rust-analyzer, and CI's setup-rust-toolchain action. Duplicating the
# pin here would create a second source of truth for the same thing.
#
# Android client toolchain (ADR-0011). The JDK is pinned here rather than left
# to the host because AGP is strict about it; Gradle itself is not pinned here
# because the checked-in wrapper already pins it, and a second pin would be the
# duplication ADR-0009 exists to prevent.
java = "temurin-21"
ktlint = "1.8.0"
"cargo:cargo-ndk" = "4.1.2"
# Apple client toolchain (#66, ADR-0013). XcodeGen generates Beam.xcodeproj from
# the committed beam-apple/project.yml, so the reviewable artifact is a YAML file
# rather than a .pbxproj -- the same reason beam-android generates its bindings
# and jniLibs rather than committing them.
#
# Xcode itself is deliberately not pinned here: mise cannot install it, and the
# `apple:*` tasks resolve `swift-format`, `xcodebuild` and `lipo` through `xcrun`
# so they follow whichever Xcode the host has selected. CI pins the version in
# the workflow instead, which is the only place that can.
#
# `os` is load-bearing, not decoration: XcodeGen publishes a macOS binary only,
# and mise installs every tool in [tools] before any task runs. Without the
# filter, `mise install` fails on Linux with "unsupported env: linux/amd64" --
# which is every Linux CI job and every Linux contributor, not just the Apple
# ones.
"aqua:yonaskolb/XcodeGen" = { version = "2.46.0", os = ["macos"] }

[env]
# Wrap the git hooks in `mise x` so contributors who have not activated mise in
# their shell still get the pinned tools on PATH. See hk.pkl.
HK_MISE = "1"
CARGO_TERM_COLOR = "always"
RUST_BACKTRACE = "1"
# The Android SDK is not a mise tool: the registry only reaches it through a
# third-party vfox plugin, and it has no NDK entry at all. `android:sdk`
# bootstraps it with Google's own tooling instead.
#
# ~/Android/Sdk is both the Android CLI's own default and Android Studio's, so
# using it means a contributor who already has either does not end up with two
# 12 GB copies. Overridable for CI images and existing installs.
ANDROID_SDK_ROOT = "{{ env.ANDROID_SDK_ROOT | default(value=env.HOME ~ '/Android/Sdk') }}"
ANDROID_HOME = "{{ env.ANDROID_SDK_ROOT | default(value=env.HOME ~ '/Android/Sdk') }}"
# cargo-ndk resolves the toolchain from here.
ANDROID_NDK_HOME = "{{ env.ANDROID_SDK_ROOT | default(value=env.HOME ~ '/Android/Sdk') }}/ndk/29.0.14206865"
# Local dev statically vendors an LGPL-only FFmpeg (ADR-0007) so the workspace
# builds on hosts without FFmpeg development libraries. CI sets this to "" in
# the job environment because .github/actions/setup-ffmpeg provides a system
# FFmpeg to link against; hosts with system FFmpeg dev libs can do the same.
#
# The template is load-bearing: a plain assignment here takes precedence over
# the ambient environment, so an exported BEAM_CARGO_FEATURES="" would be
# silently ignored and CI would build a vendored FFmpeg anyway. Reading through
# `env.` lets the caller win, and `default` only fires when it is unset -- an
# explicitly empty value stays empty.
BEAM_CARGO_FEATURES = "{{ env.BEAM_CARGO_FEATURES | default(value='beam-index/vendored-ffmpeg,beam-server/vendored-ffmpeg') }}"
# cargo-mutants builds each package separately, so it needs one *unqualified*
# feature name that every mutated package accepts. Each of the four declares
# `mutation-testing` as the set that compiles all of its `cfg`-gated production
# paths -- otherwise mutants in code the build never compiled come back MISSED
# for a reason that has nothing to do with the tests. Override on a host with
# the system FFmpeg development libraries.
BEAM_MUTANTS_FEATURES = "{{ env.BEAM_MUTANTS_FEATURES | default(value='mutation-testing') }}"
# The Apple client's minimum OS, in one place (ADR-0013). `core:apple` exports
# these to cargo so the static library is built for the same floor the app
# targets, and `apple:project` writes them into Version.xcconfig so the Xcode
# targets read the same values. Without that the linker warns that the library
# was built for a newer OS than the app -- which is not cosmetic: the library
# would be free to call symbols the declared floor does not have.
#
# Package.swift declares the same floor a third time, because SwiftPM's
# `platforms:` takes literals only. Those three must agree.
BEAM_IOS_DEPLOYMENT_TARGET = "26.0"
BEAM_MACOS_DEPLOYMENT_TARGET = "26.0"

[hooks]
# Installs .git/hooks/{pre-commit,commit-msg,pre-push} pointing at hk. Safe to
# run repeatedly, and a no-op for anyone who has run `hk install --global`.
postinstall = "hk install --mise"

# ---------------------------------------------------------------------------
# Setup
# ---------------------------------------------------------------------------

[tasks.setup]
description = "Install tools, JS dependencies, and git hooks"
run = ["bun install --frozen-lockfile", "hk install --mise"]

# ---------------------------------------------------------------------------
# Rust
#
# $BEAM_CARGO_FEATURES expands to nothing when empty, so the same task line
# serves both the vendored-FFmpeg local build and CI's system-FFmpeg build.
# ---------------------------------------------------------------------------

[tasks."rust:fmt"]
description = "Check Rust formatting"
run = "cargo fmt --check"

[tasks."rust:fmt:fix"]
description = "Format Rust code"
run = "cargo fmt"

[tasks."rust:build"]
description = "Build the Rust workspace"
run = 'cargo build --workspace ${BEAM_CARGO_FEATURES:+--features "$BEAM_CARGO_FEATURES"}'

[tasks."rust:clippy"]
description = "Lint Rust with clippy, warnings denied"
run = 'cargo clippy --workspace --all-targets ${BEAM_CARGO_FEATURES:+--features "$BEAM_CARGO_FEATURES"} -- -D warnings'

[tasks."rust:test"]
description = "Run the Rust test suite"
run = 'cargo test --workspace ${BEAM_CARGO_FEATURES:+--features "$BEAM_CARGO_FEATURES"}'

[tasks."rust:coverage"]
description = "Run Rust tests with coverage and enforce the line/region/function thresholds"
# --fail-under-regions is this project's branch-coverage gate. cargo-llvm-cov's
# --branch is nightly-only (it needs -Z coverage-options=branch) and
# rust-toolchain.toml pins stable 1.91.0, so it is simply unavailable. LLVM
# regions are a superset of branches -- every match arm and every && / ||
# short-circuit gets its own counter -- which makes region coverage the honest
# stable-toolchain proxy, and the number that correlates with mutation score.
#
# Thresholds sit a few points under the last measured value, the same calibration
# convention beam-web/vitest.config.ts documents. Measured 2026-08-28 on a clean
# workspace, after the hardening in this branch: regions 84.35%, functions
# 76.76%, lines 84.27%. Ratchet them up as the suite matures; never relax one to
# make a red pull request pass.
run = [
    'cargo llvm-cov --workspace ${BEAM_CARGO_FEATURES:+--features "$BEAM_CARGO_FEATURES"} --lcov --output-path lcov.info --fail-under-lines 81 --fail-under-regions 81 --fail-under-functions 73',
    "cargo llvm-cov report --summary-only",
]

[tasks."rust:test:pg"]
description = "Opt-in tier: run the repository contracts against a real Postgres"
# Deliberately NOT part of `ci`, `rust:test`, `rust:coverage`, or the pre-push
# hook: it is the one tier that needs infrastructure, and NFR-201 says the
# default run must not. Bring the database up first:
#   docker compose -f compose.dependencies.yaml up -d
# and point BEAM_TEST_DATABASE_URL at it. Unset, the tier fails loudly rather
# than skipping -- a tier that silently passes when it did not run is worse
# than one that does not run.
# `--package beam-index` means BEAM_CARGO_FEATURES' workspace-qualified names
# do not apply; the vendored-ffmpeg toggle is spelled unqualified here instead.
# (`BEAM_MUTANTS_FEATURES` carries the same unqualified name for cargo-mutants.)
run = '''
features="pg-integration"
case "${BEAM_CARGO_FEATURES:-}" in
    *vendored-ffmpeg*) features="$features,vendored-ffmpeg" ;;
esac
cargo test --package beam-index --features "$features" --test pg_integration
cargo test --package beam-auth --features "pg-integration,test-utils" --test pg_integration
'''

[tasks."rust:coverage:report"]
description = "Report per-file line/region/function coverage with no threshold (calibration)"
# No gate: this is what you calibrate rust:coverage's thresholds against, and
# what you read between mutation runs to pick the next target. Region coverage
# is the column to watch -- if a batch of new tests does not move it, those
# tests are re-covering already-covered lines and will not kill any mutants.
run = 'cargo llvm-cov --workspace ${BEAM_CARGO_FEATURES:+--features "$BEAM_CARGO_FEATURES"} --show-missing-lines'

[tasks."rust:deny"]
description = "Audit dependencies for advisories, licenses, bans, and sources"
run = "cargo deny check"

[tasks."rust:lockfile"]
description = "Fail if Cargo.lock is out of date with the manifests"
run = "cargo metadata --locked --format-version 1 > /dev/null"

# ---------------------------------------------------------------------------
# Mutation testing
#
# Advisory, never a merge gate: `ci-ok` in .github/workflows/ci.yml does not
# depend on any of these, and neither `ci` nor the pre-push hook runs them. A
# surviving mutant is a prompt to harden the code, not a broken build. See
# docs/testing.md and ADR-0011.
#
# Tree-invariant configuration (test_workspace, nextest, copy_target, timeouts,
# exclusions) lives in .cargo/mutants.toml. Only per-invocation choices belong
# here, so that file stays honest about what is a property of the tree.
#
# BEAM_MUTANTS_JOBS is the number of parallel scratch build directories. Each is
# a full copy of the tree including target/, so it trades disk and RAM for wall
# clock -- do not scale it with nproc. 2 suits a 4-vCPU CI runner (cargo already
# saturates those cores); 4 suits a large workstation.
# ---------------------------------------------------------------------------

[tasks."rust:mutants:list"]
description = "List the mutants cargo-mutants would generate (parses only, never builds)"
# Free -- syn parses the tree and nothing is compiled. This is how you size a run
# before committing hours to it, and how you confirm the exclusions in
# .cargo/mutants.toml are taking effect.
run = 'cargo mutants --list ${BEAM_MUTANTS_FEATURES:+--features "$BEAM_MUTANTS_FEATURES"}'

[tasks."rust:mutants"]
description = "Mutation-test the whole workspace (hours -- prefer :diff or :crate)"
run = 'cargo mutants --workspace ${BEAM_MUTANTS_FEATURES:+--features "$BEAM_MUTANTS_FEATURES"} --jobs "${BEAM_MUTANTS_JOBS:-2}"'

[tasks."rust:mutants:diff"]
description = "Mutation-test only the Rust code this branch changed"
# The diff must be merge-base..HEAD (three dots). cargo-mutants matches it
# against the *new* side, so a two-dot diff describes a tree that is not the one
# on disk and it exits 5. Only code under test is matched, never test code, so a
# test-only change legitimately yields no mutants.
run = '''
set -eu
base=${MUTANTS_BASE:-$(git merge-base HEAD origin/master 2>/dev/null || true)}
if [ -z "$base" ]; then
    echo "origin/master not available and MUTANTS_BASE unset" >&2
    exit 1
fi
diff_file=$(mktemp)
trap 'rm -f "$diff_file"' EXIT
git diff "$base"...HEAD -- '*.rs' > "$diff_file"
if [ ! -s "$diff_file" ]; then
    echo "no Rust changes since $base; nothing to mutate"
    exit 0
fi
cargo mutants --in-diff "$diff_file" \
    ${BEAM_MUTANTS_FEATURES:+--features "$BEAM_MUTANTS_FEATURES"} \
    --jobs "${BEAM_MUTANTS_JOBS:-2}"
'''

[tasks."rust:mutants:crate"]
description = "Mutation-test one crate, e.g. mise run rust:mutants:crate beam-domain"
# This is the task the hardening loop actually runs. --iterate skips everything
# caught or unviable last time, which makes second and later passes cheap;
# finish with one run without it, because --iterate assumes your edits never
# reduced coverage and only a clean run proves the crate.
#
# Selection is by *path* (--file) rather than --package, so the mutant set can
# be narrowed to one crate's sources while `test_workspace = true` still runs
# the whole suite against each mutant. That matters here because this
# architecture deliberately exercises beam-domain and beam-index logic through
# beam-server's subcutaneous tests; testing only the mutated package's own tests
# would report a large phantom backlog of MISSED mutants.
#
# cargo-mutants *builds* each package on its own regardless, which is why the
# feature name it is given must be unqualified and valid everywhere -- see
# BEAM_MUTANTS_FEATURES above.
usage = '''
arg "<crate>" help="Workspace crate to mutate (beam-auth|beam-domain|beam-index|beam-server)"
flag "--iterate" help="Skip mutants caught or unviable in the previous run"
'''
run = '''
set -eu
iterate=""
if [ "${usage_iterate:-false}" = "true" ]; then
    iterate="--iterate"
fi
# shellcheck disable=SC2086
cargo mutants --file "$usage_crate/**/*.rs" $iterate \
    ${BEAM_MUTANTS_FEATURES:+--features "$BEAM_MUTANTS_FEATURES"} \
    --jobs "${BEAM_MUTANTS_JOBS:-2}"
'''

[tasks."rust:mutants:shard"]
description = "Run one shard of the full mutation suite, e.g. rust:mutants:shard 3/16"
# k is 0-based. The sharding method is left at cargo-mutants' default of `slice`
# rather than round-robin: slice hands each shard a contiguous run of mutants,
# which in this workspace means one crate at a time and therefore maximal
# incremental-build locality. Rebuilds dominate the cost, so that is worth more
# than round-robin's better-balanced shard durations.
#
# --baseline=skip drops one clean build+test per shard, which the nightly
# workflow can afford only because a separate job proves the tree green first.
# It also removes the measured test duration the timeout would be derived from
# -- cargo-mutants falls back to a 300s constant -- so --timeout must be given
# explicitly alongside it.
usage = '''
arg "<shard>" help="Shard as k/n with k 0-based, e.g. 3/16"
'''
run = '''
set -eu
cargo mutants --workspace \
    --shard "$usage_shard" \
    --baseline=skip \
    --timeout 60 \
    ${BEAM_MUTANTS_FEATURES:+--features "$BEAM_MUTANTS_FEATURES"} \
    --jobs "${BEAM_MUTANTS_JOBS:-2}"
'''

# ---------------------------------------------------------------------------
# TypeScript / web
# ---------------------------------------------------------------------------

[tasks."ts:check"]
description = "Lint and format-check JS/TS with biome"
run = "bun run check"

[tasks."ts:check:fix"]
description = "Apply biome lint and format fixes"
run = "bun run check:fix"

[tasks."ts:typecheck"]
description = "Type-check the beam-web SPA"
# Scoped to beam-web, not `bun run typecheck` (which fans out to every
# workspace): beam-docs is type-checked by docs:build instead. Overlapping the
# two runs two Astro processes over beam-docs/node_modules/.vite, which race and
# fail with ENOTEMPTY. Keeping them disjoint also means a docs-only change,
# which the `ts` path filter in ci.yml does not match, is still type-checked.
run = "bun run --filter beam-web typecheck"

[tasks."ts:test"]
description = "Run the beam-web test suite"
run = "bun run --filter beam-web test"

[tasks."ts:coverage"]
description = "Run JS/TS tests with coverage thresholds"
run = "bun run test:coverage"

[tasks."ts:build"]
description = "Build every JS/TS workspace"
run = "bun run build"

[tasks."ts:build:web"]
description = "Build only the beam-web SPA (release asset)"
run = "bun run --filter beam-web build"

[tasks."docs:og"]
description = "Regenerate the docs site's Open Graph card (committed; run after editing the artwork)"
run = "bun run --filter beam-docs og:build"

[tasks."docs:build"]
description = "Type-check and build the beam-docs site"
run = [
    "bun run --filter beam-docs typecheck",
    "bun run --filter beam-docs build",
]

# ---------------------------------------------------------------------------
# Codegen
# ---------------------------------------------------------------------------

[tasks."codegen:openapi"]
description = "Export openapi.json from the Rust types and regenerate api.gen.ts"
run = [
    'cargo run --quiet --example export_openapi -p beam-server ${BEAM_CARGO_FEATURES:+--features "$BEAM_CARGO_FEATURES"} > beam-web/openapi.json',
    "bun run --filter beam-web codegen:openapi",
]

[tasks."codegen:openapi:check"]
description = "Fail when the committed OpenAPI spec differs from the one the router generates"
# `beam-web/openapi.json` is committed so a change to the wire contract is a
# reviewable diff rather than an invisible regeneration. This is the guard that
# keeps it honest.
run = '''
set -eu
tmp=$(mktemp)
trap 'rm -f "$tmp"' EXIT
cargo run --quiet --example export_openapi -p beam-server ${BEAM_CARGO_FEATURES:+--features "$BEAM_CARGO_FEATURES"} > "$tmp"
if ! diff -u beam-web/openapi.json "$tmp"; then
    echo
    echo "beam-web/openapi.json is stale. Run: mise run codegen:openapi" >&2
    exit 1
fi
echo "OpenAPI spec matches the router"
'''

# ---------------------------------------------------------------------------
# Android client (ADR-0011)
#
# The Android SDK is bootstrapped with Google's own sdkmanager rather than
# pinned as a mise tool: mise's registry reaches the SDK only through a
# third-party vfox plugin and carries no NDK entry at all, so a bootstrap task
# is both the smaller dependency and the only one that can pin exact package
# versions. It stays a mise task, so ADR-0009 still holds -- CI, the hooks, and
# a human all run the same command.
# ---------------------------------------------------------------------------

[tasks."android:sdk"]
description = "Bootstrap the Android SDK, NDK, and emulator image into $ANDROID_SDK_ROOT"
run = '''
set -eu

# cmdline-tools 23.0 deprecated sdkmanager in favour of an `android` CLI, which
# also retired `--licenses`: installing a package now accepts the SDK terms
# implicitly, so there is no separate acceptance step left to gate on. The
# terms are at https://developer.android.com/studio/terms; running this task
# is what agrees to them.
#
# --no-metrics is passed to every invocation. The CLI reports command and flag
# usage to Google by default, and that is a contributor's decision rather than
# something a build task should make quietly on their behalf.
cmdline_tools_zip="commandlinetools-linux-16111833_latest.zip"
cmdline_tools_sha1="e025545c62a8e64c7559119566a569fb1dec5f60"
android="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/android"

if [ ! -x "$android" ]; then
    echo "Bootstrapping the Android command-line tools into $ANDROID_SDK_ROOT"
    tmp=$(mktemp -d)
    trap 'rm -rf "$tmp"' EXIT
    curl -fsSL -o "$tmp/tools.zip" \
        "https://dl.google.com/android/repository/$cmdline_tools_zip"
    got=$(sha1sum "$tmp/tools.zip" | cut -d" " -f1)
    if [ "$got" != "$cmdline_tools_sha1" ]; then
        echo "checksum mismatch for $cmdline_tools_zip:" >&2
        echo "  expected $cmdline_tools_sha1" >&2
        echo "  got      $got" >&2
        exit 1
    fi
    unzip -q "$tmp/tools.zip" -d "$tmp"
    mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
    rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"
    mv "$tmp/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
fi

# Package coordinates use "/" under the new CLI, and platforms now carry a
# minor version -- android-37.2 rather than android-37 -- which is why the
# Gradle config sets compileSdkMinor alongside compileSdk.
#
# The NDK is pinned to 29.0.14206865 because every 30.x release is still a
# release candidate, and a release build should not cross-compile with one.
#
# The emulator and its system image are ~10 GB and are only useful where there
# is a screen and nested virtualisation. CI has neither -- the Android jobs are
# JVM-only -- so BEAM_ANDROID_SDK_MINIMAL=1 leaves them out, which is the
# difference between a job that installs 12 GB and one that installs 2.
packages="platform-tools platforms/android-37.2 build-tools/37.0.0 ndk/29.0.14206865"
if [ "${BEAM_ANDROID_SDK_MINIMAL:-0}" != "1" ]; then
    packages="$packages emulator system-images/android-37.1/google_apis_ps16k/x86_64"
fi

# shellcheck disable=SC2086
"$android" --no-metrics --sdk "$ANDROID_SDK_ROOT" sdk install $packages
'''

[tasks."core:android"]
description = "Cross-compile beam-client-core into jniLibs for every Android ABI"
run = '''
set -eu
# Under `build/`, and per profile. Not `src/main/jniLibs`, which is AGP's
# default jniLibs source directory: anything left there is packaged *in
# addition* to whatever the build generates, so a stale debug library would
# ride along in a release APK. One location, and Gradle passes the profile.
out="${BEAM_JNI_LIBS_DIR:-beam-android/core/ffi/build/jniLibs/${BEAM_CARGO_PROFILE:-debug}}"
profile="${BEAM_CARGO_PROFILE:-debug}"

# A debug build carries a ~60 MB unstripped .so per ABI, so local iteration
# builds only the emulator's architecture unless asked for more.
if [ "${BEAM_ANDROID_ALL_ABIS:-0}" = "1" ] || [ "$profile" != "debug" ]; then
    targets="-t arm64-v8a -t armeabi-v7a -t x86_64"
else
    targets="-t x86_64"
fi

release_flag=""
if [ "$profile" = "release" ]; then
    release_flag="--release"
fi

mkdir -p "$out"
# shellcheck disable=SC2086
cargo ndk $targets -o "$out" build -p beam-client-core --lib $release_flag
'''

[tasks."core:bindgen"]
description = "Generate the Kotlin bindings for beam-client-core"
run = '''
set -eu
out="${BEAM_BINDINGS_DIR:-beam-android/core/ffi/build/generated/uniffi}"

# The host cdylib's extension is not portable, and hardcoding `.so` meant this
# task could never run on a Mac -- an Android contributor on macOS hit a missing
# file rather than a build. The same four lines appear in `core:bindgen:swift`;
# they are duplicated rather than shared because mise tasks have no way to share
# a shell function, and factoring them into a script would move a command out of
# mise.toml, which ADR-0009 makes the single source of truth.
case "$(uname -s)" in
    Darwin) libext="dylib" ;;
    *) libext="so" ;;
esac

# Generated from the built library rather than from source, so the bindings can
# only ever describe a library that actually exists. Building the host cdylib
# first is cheaper than a cross build and produces identical metadata.
cargo build -p beam-client-core --lib
mkdir -p "$out"
cargo run -p beam-client-core --features uniffi-bindgen --bin uniffi-bindgen -- \
    generate \
    --library "target/debug/libbeam_client_core.$libext" \
    --language kotlin \
    --out-dir "$out" \
    --no-format
'''

[tasks."core:bindgen:swift"]
description = "Generate the Swift bindings and C header for beam-client-core"
run = '''
set -eu
out="${BEAM_SWIFT_BINDINGS_DIR:-beam-apple/Packages/BeamKit/Sources/BeamCoreBindings/Generated}"
headers="${BEAM_XCFRAMEWORK_HEADERS_DIR:-beam-apple/Packages/BeamKit/Frameworks/include}"

# See `core:bindgen` for why this is resolved rather than hardcoded.
case "$(uname -s)" in
    Darwin) libext="dylib" ;;
    *) libext="so" ;;
esac

cargo build -p beam-client-core --lib
rm -rf "$out" "$headers"
mkdir -p "$out" "$headers"
cargo run -p beam-client-core --features uniffi-bindgen --bin uniffi-bindgen -- \
    generate \
    --library "target/debug/libbeam_client_core.$libext" \
    --language swift \
    --out-dir "$out" \
    --no-format

# The .h and the modulemap belong to the XCFramework, not to the Swift target:
# the framework is what declares the `beam_client_coreFFI` clang module that the
# generated Swift imports. Xcode requires the modulemap to be named
# `module.modulemap` inside an XCFramework's headers directory, which is why it
# is renamed rather than copied verbatim.
mv "$out"/*.h "$headers/"
mv "$out"/*.modulemap "$headers/module.modulemap"
'''

[tasks."core:apple"]
description = "Build beam-client-core for the Apple targets and assemble the XCFramework"
depends = ["core:bindgen:swift"]
run = '''
set -eu

if [ "$(uname -s)" != "Darwin" ]; then
    echo "core:apple: skipping -- an XCFramework can only be assembled on macOS."
    exit 0
fi

profile="${BEAM_CARGO_PROFILE:-debug}"
frameworks="${BEAM_XCFRAMEWORK_DIR:-beam-apple/Packages/BeamKit/Frameworks}"
headers="${BEAM_XCFRAMEWORK_HEADERS_DIR:-$frameworks/include}"
xcframework="$frameworks/BeamClientCoreFFI.xcframework"
lib="libbeam_client_core.a"

release_flag=""
if [ "$profile" = "release" ]; then
    release_flag="--release"
fi

# A debug static library is tens of megabytes per slice, so local iteration
# builds only what a simulator and this Mac actually need -- the same trade
# `core:android` makes for ABIs. A device build or a release build gets every
# slice. The Intel slices are what make the XCFramework usable on an Intel Mac
# and in an Intel simulator; nothing here can produce them by cross-lipo.
all_slices="${BEAM_APPLE_ALL_SLICES:-0}"
host_arch="$(uname -m)"

targets="$host_arch-apple-darwin"
case "$host_arch" in
    arm64|aarch64) targets="aarch64-apple-darwin aarch64-apple-ios-sim" ;;
    x86_64) targets="x86_64-apple-darwin x86_64-apple-ios" ;;
esac
if [ "$all_slices" = "1" ] || [ "$profile" != "debug" ]; then
    targets="aarch64-apple-darwin x86_64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios"
fi

# Without these, cargo builds each slice against the SDK's own newest OS and
# the linker warns that the library targets a newer system than the app.
export IPHONEOS_DEPLOYMENT_TARGET="$BEAM_IOS_DEPLOYMENT_TARGET"
export MACOSX_DEPLOYMENT_TARGET="$BEAM_MACOS_DEPLOYMENT_TARGET"

for target in $targets; do
    cargo build -p beam-client-core --lib --target "$target" $release_flag
done

staging="$(mktemp -d)"
trap 'rm -rf "$staging"' EXIT

# `lipo -create` refuses a single-architecture input list on some toolchains and
# is pointless on one, so each family is assembled only from the slices that
# were actually built. An absent family is simply omitted from the XCFramework
# rather than faked, so a missing slice fails at link time with a clear message
# instead of at runtime with a missing symbol.
assemble() {
    family="$1"
    shift
    inputs=""
    for target in "$@"; do
        candidate="target/$target/$profile/$lib"
        if [ -f "$candidate" ]; then
            inputs="$inputs $candidate"
        fi
    done
    [ -n "$inputs" ] || return 0
    mkdir -p "$staging/$family"
    # shellcheck disable=SC2086
    xcrun lipo -create $inputs -output "$staging/$family/$lib"
    echo "$staging/$family/$lib"
}

args=""
for family_spec in \
    "macos:aarch64-apple-darwin:x86_64-apple-darwin" \
    "ios:aarch64-apple-ios" \
    "ios-simulator:aarch64-apple-ios-sim:x86_64-apple-ios"
do
    family="${family_spec%%:*}"
    slices="$(echo "${family_spec#*:}" | tr ':' ' ')"
    # shellcheck disable=SC2086
    built="$(assemble "$family" $slices)"
    if [ -n "$built" ]; then
        args="$args -library $built -headers $headers"
    fi
done

if [ -z "$args" ]; then
    echo "core:apple: no slices were built -- nothing to assemble." >&2
    exit 1
fi

rm -rf "$xcframework"
mkdir -p "$frameworks"
# shellcheck disable=SC2086
xcrun xcodebuild -create-xcframework $args -output "$xcframework"
'''

[tasks."codegen:openapi:core"]
description = "Re-export the OpenAPI document beam-client-core generates from"
run = [
    'cargo run --quiet --example export_openapi -p beam-server ${BEAM_CARGO_FEATURES:+--features "$BEAM_CARGO_FEATURES"} > beam-client-core/api/openapi.json',
]

[tasks."android:avd"]
description = "Create the phone and tablet emulator AVDs (idempotent)"
# Creating the AVDs is not the same as being able to run one. On a headless
# host the emulator may segfault during boot -- `qemu-system-x86 dumped core`
# in the journal, with the X11/EGL/GLES modules loaded -- regardless of
# `-no-window` and of `-gpu swiftshader_indirect`, `-gpu guest` or `-gpu off`.
# Nothing in the app or these tasks causes it; it is the host's graphics stack.
# CI never boots an emulator for exactly this class of reason: the Robolectric
# and Roborazzi suites are the automated coverage, and a device is the manual
# tier.
depends = ["android:sdk"]
run = '''
set -eu
android="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/android"

# Both form factors, because #67 asks for phone *and* tablet and the adaptive
# layouts are the part most likely to regress unnoticed on one of them.
#
# The new CLI chooses the system image for a profile itself; there is no flag
# to pin one, so this deliberately does not try to.
existing=$("$android" --no-metrics emulator list 2>/dev/null || true)
for profile in medium_phone medium_tablet; do
    if printf '%s' "$existing" | grep -q "$profile"; then
        echo "AVD $profile already exists"
    else
        "$android" --no-metrics emulator create "$profile"
    fi
done
'''

# ---------------------------------------------------------------------------
# Commit hygiene
# ---------------------------------------------------------------------------

[tasks."commits:check"]
description = "Validate that commits on this branch are Conventional Commits"
# convco reads the revision range from $CONVCO_REV. CI sets it explicitly from
# the pull request's base and head SHAs, because a fetch-depth:0 checkout does
# not necessarily create an origin/master ref to compute a merge base against.
run = '''
set -eu
if [ -z "${CONVCO_REV:-}" ]; then
    base=$(git merge-base HEAD origin/master 2>/dev/null || true)
    if [ -z "$base" ]; then
        echo "origin/master not available and CONVCO_REV unset; skipping"
        exit 0
    fi
    CONVCO_REV="$base..HEAD"
    export CONVCO_REV
fi
convco check
'''

[tasks."commits:check-title"]
description = "Validate $PR_TITLE as a Conventional Commit"
# A squash merge lands the pull request title as the commit message that
# release-please parses, so the title must satisfy the same grammar the
# commit-msg hook enforces.
run = '''
set -eu
if [ -z "${PR_TITLE:-}" ]; then
    echo "PR_TITLE is not set" >&2
    exit 1
fi
printf '%s' "$PR_TITLE" | convco check --from-stdin --strip
'''

# ---------------------------------------------------------------------------
# Consistency guards
# ---------------------------------------------------------------------------

[tasks."check:ffmpeg-version"]
description = "Assert FFmpeg is pinned to the same version everywhere it is built"
run = '''
set -eu
want=$(sed -n 's/^ffmpeg-next = "\([0-9]*\.[0-9]*\)".*/\1/p' Cargo.toml)
if [ -z "$want" ]; then
    echo "could not read the ffmpeg-next version from Cargo.toml" >&2
    exit 1
fi

status=0
for file in .github/actions/setup-ffmpeg/action.yml beam-server/Containerfile; do
    found=$(grep -oE 'ffmpeg-[0-9]+\.[0-9]+' "$file" | sed 's/^ffmpeg-//' | sort -u)
    if [ -z "$found" ]; then
        echo "$file: no ffmpeg-<version> reference found" >&2
        status=1
        continue
    fi
    for version in $found; do
        if [ "$version" != "$want" ]; then
            echo "$file: builds FFmpeg $version but Cargo.toml pins ffmpeg-next $want" >&2
            status=1
        fi
    done
done

if [ "$status" -eq 0 ]; then
    echo "FFmpeg $want is pinned consistently"
fi
exit "$status"
'''

[tasks."check:mutants-skip-fakes"]
description = "Assert every test-utils-gated item is also marked #[mutants::skip]"
# cargo-mutants decides what not to mutate by looking for the *literal*
# attribute `#[cfg(test)]`. Against `#[cfg(any(test, feature = "test-utils"))]`
# its parse of the nested meta fails, it takes the error branch, and the item is
# NOT excluded -- so the InMemory*/Fake*/TestClock doubles get mutated like
# production code. Under `cargo test` the `test` arm of the cfg is active, so
# those mutants compile and run: they are viable, they fill the report with
# meaningless survivors, and the ones that are killed inflate the caught rate
# with kills that prove nothing about product behaviour.
#
# An `exclude_re` in .cargo/mutants.toml cannot fix this safely. It matches on
# names, the doubles are interleaved with real logic in the same files, and this
# workspace has had un-gated production types whose names begin with `InMemory`.
# A silent, name-based exemption of real code is the one failure mode a mutation
# setup must not have, so the exclusion is explicit and per-item instead.
#
# The rule: `#[mutants::skip]` immediately above the cfg attribute. `use` items
# are exempt -- attribute macros are not accepted on them and re-exports
# generate no mutants.
run = '''
set -eu
status=0
# `git ls-files` still lists a file deleted in the working tree; skip those so
# the guard reflects the tree as it is, not as it was committed.
for file in $(git ls-files '*.rs'); do
    [ -f "$file" ] || continue
    awk -v f="$file" '
      {
          line = $0
          sub(/^[ \t]+/, "", line)
          if (line == "#[cfg(any(test, feature = \"test-utils\"))]") {
              if ((getline nxt) > 0) {
                  n = nxt
                  sub(/^[ \t]+/, "", n)
                  # `use` items take no mutants, and a non-inline `mod foo;`
                  # cannot carry an attribute proc macro at all -- that is
                  # unstable -- so such files are excluded by path in
                  # .cargo/mutants.toml instead. Everything else must be marked.
                  if (n !~ /^(pub )?use / && n !~ /^(pub )?mod [A-Za-z_][A-Za-z0-9_]*;/ && prev != "#[mutants::skip]") {
                      printf "%s:%d: test-only item is not marked #[mutants::skip]\n", f, NR - 1
                      bad = 1
                  }
                  prev = n
                  next
              }
          }
          prev = line
      }
      END { exit bad }
    ' "$file" || status=1
done
if [ "$status" -eq 0 ]; then
    echo "every test-utils-gated item is marked #[mutants::skip]"
fi
exit "$status"
'''

# ---------------------------------------------------------------------------
# Aggregate
# ---------------------------------------------------------------------------

[tasks."android:lint"]
description = "Format-check the Kotlin sources and run Android Lint"
run = '''
set -eu
# ktlint runs over the sources rather than through Gradle: it is the same
# binary the pre-commit hook uses, so a hook pass and a CI pass cannot
# disagree. Generated bindings are excluded by beam-android/.ktlintignore.
ktlint --relative 'beam-android/**/*.kt' '!beam-android/**/build/**'
cd beam-android && ./gradlew lintDebug
'''

[tasks."android:lint:fix"]
description = "Rewrite the Kotlin sources to satisfy ktlint"
run = "ktlint --format --relative 'beam-android/**/*.kt' '!beam-android/**/build/**'"

[tasks."android:test"]
description = "Run the Android unit tests (JVM and Robolectric)"
run = "cd beam-android && ./gradlew testDebugUnitTest"

[tasks."android:screenshot"]
description = "Check the rendered screens against the recorded references"
run = "cd beam-android && ./gradlew verifyRoborazziDebug"

[tasks."android:screenshot:record"]
description = "Re-record the screenshot references after an intended visual change"
run = "cd beam-android && ./gradlew recordRoborazziDebug"

[tasks."android:build"]
description = "Assemble the debug APK"
run = "cd beam-android && ./gradlew assembleDebug"

[tasks."android:release"]
description = "Assemble the release APK for every ABI"
# No explicit cross-compile step: the Gradle `cargoNdkRelease` task selects the
# release profile itself, and every ABI with it. Doing it here as well would be
# a second place for the profile to be chosen, and the two could disagree --
# which is exactly the bug that made an earlier release APK carry debug
# libraries.
run = "cd beam-android && ./gradlew assembleRelease"

# ---------------------------------------------------------------------------
# Apple client (#66, ADR-0013)
#
# Every task here begins with the same `uname` guard. Apple builds need macOS,
# and `mise run ci` has to stay runnable on Linux -- a hard failure there would
# make the aggregate task useless to anyone not on a Mac, and dropping these
# from `ci` would mean the hooks and CI no longer run the same set.
#
# The Apple toolchain is reached through `xcrun` rather than by absolute path,
# so these follow whichever Xcode `xcode-select` points at. `swift-format`
# ships inside Xcode, so there is no separate tool to pin.
# ---------------------------------------------------------------------------

[tasks."apple:project"]
description = "Generate Beam.xcodeproj and Version.xcconfig from project.yml and version.txt"
run = '''
set -eu

if [ "$(uname -s)" != "Darwin" ]; then
    echo "apple:project: skipping -- Xcode projects are only generated on macOS."
    exit 0
fi

version="$(tr -d '[:space:]' < version.txt)"

# CFBundleVersion has to increase monotonically for every build TestFlight or
# the App Store ever sees, and it is compared as a build number rather than as
# the semver in MARKETING_VERSION. Deriving it from version.txt keeps the single
# product version of ADR-0009 authoritative with nothing to bump by hand -- the
# same reason beam-android derives versionCode rather than storing it.
major="${version%%.*}"
rest="${version#*.}"
minor="${rest%%.*}"
patch="${rest#*.}"
patch="${patch%%-*}"
build="$(( major * 10000 + minor * 100 + patch ))"

cat > beam-apple/Version.xcconfig <<EOF
// Generated by \`mise run apple:project\`. Do not edit.
//
// The version comes from version.txt and the OS floor from mise.toml, so both
// have exactly one source (ADR-0009).
MARKETING_VERSION = $version
CURRENT_PROJECT_VERSION = $build
IPHONEOS_DEPLOYMENT_TARGET = $BEAM_IOS_DEPLOYMENT_TARGET
MACOSX_DEPLOYMENT_TARGET = $BEAM_MACOS_DEPLOYMENT_TARGET
EOF

cd beam-apple && xcodegen generate --quiet
'''

[tasks."apple:lint"]
description = "Format-check the Swift sources"
run = '''
set -eu

if [ "$(uname -s)" != "Darwin" ]; then
    echo "apple:lint: skipping -- swift-format ships inside Xcode."
    exit 0
fi

beam_swift_sources() {
    find beam-apple -name '*.swift' \
        -not -path '*/BeamCoreBindings/Generated/*' \
        -not -path '*/.build/*' \
        -not -path '*/Beam.xcodeproj/*'
}

# Run over the sources rather than through Xcode: it is the same binary the
# pre-commit hook uses, so a hook pass and a CI pass cannot disagree.
#
# The file list is built here rather than with `--recursive`, because
# swift-format has no exclude mechanism and the generated UniFFI bindings sit
# under Sources/BeamCoreBindings. Linting generated code produces hundreds of
# findings nobody can act on -- the next `core:bindgen:swift` would undo any
# fix -- and would bury a real one.
xcrun swift-format lint --strict --parallel $(beam_swift_sources)
'''

[tasks."apple:lint:fix"]
description = "Rewrite the Swift sources to satisfy swift-format"
run = '''
set -eu

if [ "$(uname -s)" != "Darwin" ]; then
    echo "apple:lint:fix: skipping -- swift-format ships inside Xcode."
    exit 0
fi

beam_swift_sources() {
    find beam-apple -name '*.swift' \
        -not -path '*/BeamCoreBindings/Generated/*' \
        -not -path '*/.build/*' \
        -not -path '*/Beam.xcodeproj/*'
}

xcrun swift-format format --in-place --parallel $(beam_swift_sources)
'''

[tasks."apple:test"]
description = "Run the BeamKit unit tests on macOS and the iOS simulator"
depends = ["core:apple"]
dir = "beam-apple/Packages/BeamKit"
run = '''
set -eu

if [ "$(uname -s)" != "Darwin" ]; then
    echo "apple:test: skipping -- the Apple suite needs Xcode."
    exit 0
fi

# Both destinations, because the two platforms genuinely differ: the design
# system branches on idiom and the playback engines resolve different AVKit
# types, so a suite that only ran on macOS would never have compiled the iOS
# shell. The snapshot target is skipped here and owned by `apple:snapshot`,
# which pins the one simulator its references were recorded on.
xcrun xcodebuild test \
    -scheme BeamKit \
    -destination "platform=macOS" \
    -skip-testing:SnapshotTests

xcrun xcodebuild test \
    -scheme BeamKit \
    -destination "${BEAM_IOS_DESTINATION:-platform=iOS Simulator,name=iPhone 17 Pro}" \
    -skip-testing:SnapshotTests
'''

[tasks."apple:snapshot"]
description = "Check the rendered screens against the recorded references"
depends = ["core:apple"]
dir = "beam-apple/Packages/BeamKit"
run = '''
set -eu

if [ "$(uname -s)" != "Darwin" ]; then
    echo "apple:snapshot: skipping -- the snapshot tier needs an iOS simulator."
    exit 0
fi

# One pinned simulator, deliberately. Snapshot references are pixel comparisons
# and are only meaningful against a fixed idiom, scale and OS version -- the
# equivalent of beam-android pinning Robolectric to one API level.
xcrun xcodebuild test \
    -scheme BeamKit \
    -destination "${BEAM_IOS_DESTINATION:-platform=iOS Simulator,name=iPhone 17 Pro}" \
    -only-testing:SnapshotTests
'''

[tasks."apple:snapshot:record"]
description = "Re-record the snapshot references after an intended visual change"
depends = ["core:apple"]
dir = "beam-apple/Packages/BeamKit"
run = '''
set -eu

if [ "$(uname -s)" != "Darwin" ]; then
    echo "apple:snapshot:record: skipping -- the snapshot tier needs an iOS simulator."
    exit 0
fi

# TEST_RUNNER_ prefixed, because a simulator test runs in its own process and
# does not inherit this shell's environment. A plain `BEAM_SNAPSHOT_RECORD=1`
# here would be silently ignored, and the task would verify the references it
# was asked to replace -- which looks like success.
#
# Recording always "fails": snapshot-testing reports every newly written
# reference as a failure so a recording run can never be mistaken for a passing
# one. That is why this does not propagate the exit status.
xcrun xcodebuild test \
    -scheme BeamKit \
    -destination "${BEAM_IOS_DESTINATION:-platform=iOS Simulator,name=iPhone 17 Pro}" \
    -only-testing:SnapshotTests \
    TEST_RUNNER_BEAM_SNAPSHOT_RECORD=1 || true

echo "References written. Review the diff before committing them."
'''

[tasks."apple:build"]
description = "Build the iOS and macOS apps"
depends = ["apple:project", "core:apple"]
run = '''
set -eu

if [ "$(uname -s)" != "Darwin" ]; then
    echo "apple:build: skipping -- the apps can only be built on macOS."
    exit 0
fi

# CODE_SIGNING_ALLOWED=NO so this needs no signing identity: CI has none, and a
# contributor should not need an Apple Developer account to check that the app
# still compiles. Producing an installable build is a release concern.
xcrun xcodebuild build \
    -project beam-apple/Beam.xcodeproj \
    -scheme "Beam (iOS)" \
    -destination "${BEAM_IOS_DESTINATION:-platform=iOS Simulator,name=iPhone 17 Pro}" \
    CODE_SIGNING_ALLOWED=NO

xcrun xcodebuild build \
    -project beam-apple/Beam.xcodeproj \
    -scheme "Beam (macOS)" \
    -destination "platform=macOS" \
    CODE_SIGNING_ALLOWED=NO
'''

[tasks.ci]
description = "Run every check that CI enforces, except coverage and image builds"
depends = [
    "rust:fmt",
    "rust:clippy",
    "rust:test",
    "rust:deny",
    "rust:lockfile",
    "check:ffmpeg-version",
    "check:mutants-skip-fakes",
    "codegen:openapi:check",
    "ts:check",
    "ts:typecheck",
    "ts:test",
    "docs:build",
    "android:lint",
    "android:test",
    "android:screenshot",
    # No-ops on a non-Darwin host, so `mise run ci` stays runnable on Linux
    # while a Mac runs the same set CI enforces. See the apple:* tasks above.
    "apple:lint",
    "apple:test",
    "apple:snapshot",
    "apple:build",
]
