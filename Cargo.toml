[workspace]
members = [
    "beam-auth",
    "beam-client-core",
    "beam-domain",
    "beam-index",
    "beam-server",
    "beam-migration",
    "beam-entity",
    "beam-test-support",
]
resolver = "3"

# Beam ships as one product -- a server binary and a web image built from the
# same commit -- and no crate is published, so a single version describes the
# whole workspace. release-please rewrites the line below; every crate inherits
# it via `version.workspace = true`, and package.json files are kept in step.
[workspace.package]
version = "0.1.0" # x-release-please-version
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
# http 1.3.x has a corrupted publish that fails to compile; pin to >=1.4
http = ">=1.4, <2"
argon2 = { version = "0.6.0", features = ["std"] }
sha2 = "0.11"
async-trait = "0.1"
chrono = "0.4.45"
confique = "0.4.0"
ffmpeg-next = "9.0"
jsonwebtoken = { version = "11.0.0", features = ["aws_lc_rs"] }
# Kynos does not re-export the stream trait its `Sse` response is generic over.
# 0.3.32 is spargen's floor for a generated streaming client: its E023
# runtime-dependency check parses the caret lower bound, so a bare "0.3"
# reads as 0.3.0 and fails even though the lockfile resolves higher.
futures-core = "0.3.32"
# The HTTP edge (ADR-0010). Kynos derives the OpenAPI 3.2 document from the same
# types the server runs on, so runtime routing and the description cannot
# disagree. `openapi32` carries `Sse`, `itemSchema` and the streaming response
# subtree -- 3.1 has no way to describe a sequential body, so Kynos gates the
# whole subtree on it rather than describe a stream inaccurately. Confined to
# `beam-server`: no other crate may depend on this.
kynos = { version = "0.1.0", features = [
    "openapi32",
    "macros",
    "server",
    "http1",
    "http2",
    "json",
    "trace",
    "cookie",
    "compression",
    "uuid",
    "time-chrono",
    "decimal-rust",
    "docs",
] }
# The `metrics` facade is a no-op unless a recorder is installed
# (BEAM_ENABLE_METRICS=true), so domain crates can emit counters freely.
# The Prometheus exporter renders through beam-server's own /metrics route;
# its default features (bundled hyper listener + push gateway) stay off.
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
metrics-util = { version = "0.20.4", default-features = false, features = [
    "debugging",
] }
# Provides the `#[mutants::skip]` attribute. cargo-mutants recognises only the
# literal `#[cfg(test)]` when deciding what not to mutate -- it parses
# `#[cfg(any(test, feature = "test-utils"))]` as an unrecognised form and
# mutates the contents -- so every test-utils-gated double must carry an
# explicit skip. `mise run check:mutants-skip-fakes` enforces this. The crate is
# MIT with zero dependencies and compiles to nothing when cargo-mutants is not
# running. See docs/testing.md and ADR-0011.
mutants = "0.0.4"
rand = "0.10.2"
regex = "1.13.1"
sea-orm = { version = "1.1", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "with-uuid",
    "with-chrono",
    "with-json",
    "postgres-array",
] }
sea-orm-migration = { version = "1.1", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
] }
serde = "1.0.229"
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
# 1.24.0 is spargen's floor for `format: uuid` in a generated client (E023).
uuid = { version = "1.26.0", features = ["v4", "serde"] }
walkdir = "2.5.0"

[profile.release]
codegen-units = 1
lto = "thin"
# panic = "abort"
# strip = true

[profile.release-with-debug]
inherits = "release"
debug = true
