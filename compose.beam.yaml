services:
  server:
    build:
      context: .
      dockerfile: beam-server/Containerfile
    environment:
      # Backend server configuration
      BIND_ADDRESS: ${BIND_ADDRESS:-0.0.0.0:8000}
      SERVER_URL: ${SERVER_URL:-http://localhost:8000}

      # Database connection
      DATABASE_URL: ${DATABASE_URL:-postgres://beam:password@postgres:5432/beam}

      # Logging configuration
      RUST_LOG: ${RUST_LOG:-beam_server=info,tower_http=debug,axum=debug}

      # Media directories
      VIDEO_DIR: ${VIDEO_DIR:-/videos}
      CACHE_DIR: ${CACHE_DIR:-/cache}

      # Optional: Enable metrics
      ENABLE_METRICS: ${ENABLE_METRICS:-false}

      # Auth & Session
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is not set or is empty}
    ports:
      - "${STREAM_HOST_PORT:-8000}:8000"
    volumes:
      # Use named volumes by default, or custom host paths if specified
      - ${HOST_VIDEO_DIR:-server_videos}:${VIDEO_DIR:-/videos}
      - ${HOST_CACHE_DIR:-server_cache}:${CACHE_DIR:-/cache}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
      # To disable healthcheck, use:
      # disable: true
    networks:
      - default
      - beam_proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.server.rule: "Host(`server.beam.localhost`)"
      traefik.http.routers.server.entrypoints: websecure
      traefik.http.routers.server.tls: "true"
      traefik.http.services.server.loadbalancer.server.port: "8000"
      # Disable response buffering for low-latency media streaming
      traefik.http.services.server.loadbalancer.responseForwarding.flushInterval: "-1"

  web:
    build:
      context: .
      dockerfile: beam-web/Containerfile
      args:
        # Pass build-time environment variables for Vite
        C_APP_TITLE: ${C_APP_TITLE:-Beam}
        C_STREAM_SERVER_URL: ${C_STREAM_SERVER_URL:-http://localhost:8000}
    environment:
      # Runtime environment variables (if needed by nginx or the container)
      C_APP_TITLE: ${C_APP_TITLE:-Beam}
      C_STREAM_SERVER_URL: ${C_STREAM_SERVER_URL:-http://localhost:8000}
    ports:
      - "${WEB_HOST_PORT:-8080}:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - default
      - beam_proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.web.rule: "Host(`beam.localhost`)"
      traefik.http.routers.web.entrypoints: websecure
      traefik.http.routers.web.tls: "true"
      traefik.http.services.web.loadbalancer.server.port: "80"

# Named volumes for video and cache (used when HOST_*_DIR is not set)
volumes:
  server_videos:
  server_cache:

networks:
  beam_proxy:
    name: beam_proxy
