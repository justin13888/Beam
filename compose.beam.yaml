services:
  server:
    build:
      context: .
      dockerfile: beam-server/Containerfile
    # List form (rather than `VAR: ${VAR:-default}` map form) is used
    # throughout so that an unset host/`.env` variable is genuinely *absent*
    # inside the container, not merely an empty string. That distinction
    # matters for beam-server's `Option<...>` config fields (OIDC issuer/
    # client id/secret, extra allowed origins, admin emails): confique
    # resolves a truly-unset env var to `None`, but an *explicitly empty*
    # one only does that for types where empty fails to parse (e.g. bool) --
    # for `Option<String>` fields an empty string would incorrectly resolve
    # to `Some("")`, which would make `oidc_configured()` wrongly report
    # OIDC as configured against an empty issuer URL. Effective defaults
    # (from beam-server/src/config.rs) are documented below for reference;
    # override any of these in your shell or a `.env` file at the repo root.
    environment:
      # BEAM_BIND_ADDRESS (default 0.0.0.0:8000)
      - BEAM_BIND_ADDRESS
      # BEAM_SERVER_URL (default http://localhost:8000)
      - BEAM_SERVER_URL
      # BEAM_DATABASE_URL (default postgres://beam:password@postgres:5432/beam;
      # the default below points at this compose file's `postgres` service)
      - BEAM_DATABASE_URL=${BEAM_DATABASE_URL:-postgres://beam:password@postgres:5432/beam}
      - RUST_LOG=${RUST_LOG:-beam_server=info,tower_http=debug,axum=debug}

      # Media directories: BEAM_VIDEO_DIR is read-only (your media library);
      # BEAM_DATA_DIR is server-writable state.
      - BEAM_VIDEO_DIR=${BEAM_VIDEO_DIR:-/videos}
      - BEAM_DATA_DIR=${BEAM_DATA_DIR:-/data}

      - BEAM_ENABLE_METRICS=${BEAM_ENABLE_METRICS:-false}

      # Schema migrations apply automatically at startup; set to false for
      # operator-managed migrations via the beam-migration CLI.
      - BEAM_AUTO_MIGRATE=${BEAM_AUTO_MIGRATE:-true}

      # Indexing / filesystem watcher (defaults match config.rs)
      - BEAM_HASH_UNKNOWN_FILES=${BEAM_HASH_UNKNOWN_FILES:-true}
      - BEAM_SCAN_INTERVAL_SECS=${BEAM_SCAN_INTERVAL_SECS:-3600}
      - BEAM_WATCH_ENABLED=${BEAM_WATCH_ENABLED:-true}
      - BEAM_WATCH_DEBOUNCE_MS=${BEAM_WATCH_DEBOUNCE_MS:-2000}

      # Metadata enrichment (cameo -> TMDB/AniList). BEAM_TMDB_API_TOKEN
      # absent means TMDB-eligible titles are left un-enriched;
      # AniList-sourced titles still enrich without any token.
      - BEAM_ENRICH_INTERVAL_SECS=${BEAM_ENRICH_INTERVAL_SECS:-300}
      - BEAM_TMDB_API_TOKEN
      - BEAM_ANILIST_ENABLED=${BEAM_ANILIST_ENABLED:-true}

      # OIDC auth (see ADR-0003 / docs/architecture/security.md). Login is
      # disabled with a clear error -- not a crash -- until issuer,
      # client_id, and client_secret are all set. The bundled `dex` dev IdP
      # (compose.dependencies.yaml) is reachable from a browser at
      # http://localhost:5556/dex, but reaching it from *inside* this
      # container needs host networking or an equivalent DNS alias -- the
      # fully-containerized OIDC topology is a tracked follow-up, not
      # solved by this compose file; run beam-server on the host to exercise
      # the OIDC flow in dev (see docs/operations/deployment.md).
      - BEAM_OIDC_ISSUER
      - BEAM_OIDC_CLIENT_ID
      - BEAM_OIDC_CLIENT_SECRET
      - BEAM_OIDC_SCOPES=${BEAM_OIDC_SCOPES:-openid profile email}
      - BEAM_WEB_URL=${BEAM_WEB_URL:-http://localhost:5173}
      - BEAM_EXTRA_ALLOWED_ORIGINS
      - BEAM_ADMIN_EMAILS
      - BEAM_COOKIE_SECURE
      - BEAM_SESSION_IDLE_DAYS=${BEAM_SESSION_IDLE_DAYS:-14}
      - BEAM_SESSION_MAX_DAYS=${BEAM_SESSION_MAX_DAYS:-60}
    ports:
      - "${BEAM_SERVER_HOST_PORT:-8000}:8000"
    volumes:
      # Use named volumes by default, or custom host paths if specified
      - ${HOST_VIDEO_DIR:-server_videos}:${BEAM_VIDEO_DIR:-/videos}
      - ${HOST_DATA_DIR:-server_data}:${BEAM_DATA_DIR:-/data}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The health route lives under the versioned API mount (see
      # beam-server/src/routes/mod.rs).
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
      # To disable healthcheck, use:
      # disable: true
    networks:
      - default
      - beam_proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.server.rule: "Host(`server.beam.localhost`)"
      traefik.http.routers.server.entrypoints: websecure
      traefik.http.routers.server.tls: "true"
      traefik.http.services.server.loadbalancer.server.port: "8000"
      # Disable response buffering for low-latency media streaming
      traefik.http.services.server.loadbalancer.responseForwarding.flushInterval: "-1"

  web:
    build:
      context: .
      dockerfile: beam-web/Containerfile
      args:
        # Pass build-time environment variables for Vite
        C_APP_TITLE: ${C_APP_TITLE:-Beam}
        C_STREAM_SERVER_URL: ${C_STREAM_SERVER_URL:-http://localhost:8000}
    environment:
      # Runtime environment variables (if needed by nginx or the container)
      C_APP_TITLE: ${C_APP_TITLE:-Beam}
      C_STREAM_SERVER_URL: ${C_STREAM_SERVER_URL:-http://localhost:8000}
    ports:
      - "${WEB_HOST_PORT:-8080}:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - default
      - beam_proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.web.rule: "Host(`beam.localhost`)"
      traefik.http.routers.web.entrypoints: websecure
      traefik.http.routers.web.tls: "true"
      traefik.http.services.web.loadbalancer.server.port: "80"

# Named volumes for video and server data (used when HOST_*_DIR is not set)
volumes:
  server_videos:
  server_data:

networks:
  beam_proxy:
    name: beam_proxy
