services:
  postgres:
    image: docker.io/postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-beam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-beam}
    volumes:
      - postgres:/var/lib/postgresql
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beam}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Lightweight dev OIDC IdP (see ADR-0003), behind the `dev-idp` profile so it
  # is opt-in rather than part of the default stack: beam is bring-your-own-IdP
  # (FR-101), and production deployments point BEAM_OIDC_ISSUER at Keycloak/
  # Authentik/Authelia/a hosted IdP. `mise run dev:up` enables the profile and
  # supplies the matching BEAM_OIDC_* wiring; a bare `podman compose up` starts
  # no IdP and leaves login disabled with a clear error.
  #
  # The `dex.beam.localhost` alias is what makes the containerized flow work at
  # all (#73). The issuer string has to be byte-identical for the browser and
  # for beam-server, because openidconnect validates the discovery document's
  # `issuer` against the configured one and re-checks it on the ID token's
  # `iss`. `*.localhost` resolves to loopback on the host (RFC 6761) and to this
  # container through compose DNS, so one string satisfies both -- and the
  # host-run `cargo run -p beam-server` flow as well.
  #
  # This leans on one property of the *server* image, so do not treat it as
  # free: it works only because that image's resolver does *not* special-case
  # subdomains of `.localhost`, letting the compose DNS alias win. musl does
  # special-case them -- resolving to the container's own loopback, never
  # reaching this service -- and glibc has been moving the same way. The
  # runtime stage is debian:trixie-slim today, which is why this works.
  # Rebasing it on Alpine, or onto a base with a newer resolver, breaks dev
  # login; `mise run dev:verify-oidc` is what catches it.
  dex:
    image: ghcr.io/dexidp/dex:v2.45.1
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    profiles: [dev-idp]
    volumes:
      - ./dex/config.yaml:/etc/dex/config.yaml:ro
      - dex:/var/dex
    ports:
      - "${DEX_HOST_PORT:-5556}:5556"
    networks:
      default:
        aliases:
          - dex.beam.localhost
    healthcheck:
      # Dex serves /healthz under the issuer's path prefix, so /dex/healthz --
      # a bare /healthz is a 404. The image ships busybox wget, not curl.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5556/dex/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  traefik:
    image: docker.io/traefik:v3.7.12
    command:
      # Dashboard (bound to loopback only)
      - --api.dashboard=true
      - --api.insecure=true
      # Docker provider: watch for container events to auto-reconnect when beam services are rebuilt
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=beam_proxy
      # HTTP entrypoint: redirect all traffic to HTTPS
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      # HTTPS entrypoint with HTTP/3 (QUIC over UDP)
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http3=true
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
      - "${TRAEFIK_HTTPS_PORT:-443}:443/udp"
      # Dashboard only on loopback
      - "127.0.0.1:${TRAEFIK_DASHBOARD_PORT:-8888}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - beam_proxy
    restart: unless-stopped

volumes:
  postgres:
  dex:

networks:
  # Declared explicitly even though Compose would create `default` implicitly:
  # `dex` attaches to it by name to carry the `dex.beam.localhost` alias, and
  # podman-compose refuses a project whose services reference a network no file
  # declares (`RuntimeError: missing networks: default`). Docker Compose accepts
  # the implicit form, so this is the one line that keeps `podman compose` --
  # which mise.toml prefers and the README documents first -- a working runtime.
  default:
  beam_proxy:
    name: beam_proxy
