services:
  postgres:
    image: docker.io/postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-beam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-beam}
    volumes:
      - postgres:/var/lib/postgresql
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beam}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Lightweight dev OIDC IdP (see ADR-0003). Ships static test users so local
  # dev/evaluation doesn't require standing up a real identity provider;
  # production deployments point BEAM_OIDC_ISSUER at Keycloak/Authentik/
  # Authelia/a hosted IdP instead.
  dex:
    image: ghcr.io/dexidp/dex:v2.45.1
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ./dex/config.yaml:/etc/dex/config.yaml:ro
      - dex:/var/dex
    ports:
      - "${DEX_HOST_PORT:-5556}:5556"

  traefik:
    image: docker.io/traefik:v3.7.12
    command:
      # Dashboard (bound to loopback only)
      - --api.dashboard=true
      - --api.insecure=true
      # Docker provider: watch for container events to auto-reconnect when beam services are rebuilt
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=beam_proxy
      # HTTP entrypoint: redirect all traffic to HTTPS
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      # HTTPS entrypoint with HTTP/3 (QUIC over UDP)
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http3=true
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
      - "${TRAEFIK_HTTPS_PORT:-443}:443/udp"
      # Dashboard only on loopback
      - "127.0.0.1:${TRAEFIK_DASHBOARD_PORT:-8888}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - beam_proxy
    restart: unless-stopped

volumes:
  postgres:
  dex:

networks:
  beam_proxy:
    name: beam_proxy
