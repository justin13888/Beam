[package]
name = "beam-test-support"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Dev-dependency of the crates that own repositories; never depended on by any
# production target. It exists for exactly one thing the hermetic tier cannot
# provide: a real Postgres, behind the opt-in `pg-integration` feature.
#
# Note the dependency direction. This crate depends on `beam-domain`,
# `beam-entity` and `beam-migration`; none of them depend on it. The shared
# behavioural contracts and the domain builders deliberately live *in*
# `beam-domain` under its `test-utils` feature instead -- putting them here
# would make `beam-domain` dev-depend on a crate that depends on it, which
# cargo rejects as a cycle.

[dependencies]
beam-domain = { path = "../beam-domain", features = ["entity", "test-utils"], optional = true }
beam-entity = { path = "../beam-entity", optional = true }
beam-migration = { path = "../beam-migration", optional = true }
chrono = { workspace = true, optional = true }
sea-orm = { workspace = true, optional = true }
sea-orm-migration = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[features]
default = []
# Off by default so `cargo test --workspace` needs no infrastructure (NFR-201).
pg-integration = [
    "dep:beam-domain",
    "dep:beam-entity",
    "dep:beam-migration",
    "dep:chrono",
    "dep:sea-orm",
    "dep:sea-orm-migration",
    "dep:tokio",
    "dep:uuid",
]
