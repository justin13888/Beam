# The Xcode project is generated, never committed. XcodeGen reads this file, so
# the reviewable artifact is a hundred lines of YAML rather than a .pbxproj that
# no one can read in a diff and everyone conflicts on -- the same reasoning that
# has beam-android generate its bindings and jniLibs rather than commit them.
#
# Regenerate with `mise run apple:project`.

name: Beam
options:
  bundleIdPrefix: net.justinchung.beam
  # The deployment target is deliberately absent: Version.xcconfig supplies
  # IPHONEOS_DEPLOYMENT_TARGET and MACOSX_DEPLOYMENT_TARGET from mise.toml, so
  # the app and the Rust static library are built for the same floor.
  createIntermediateGroups: true
  generateEmptyDirectories: true
  # Schemes are declared below rather than generated per target, so
  # `mise run apple:test` and `apple:build` name schemes that are stable.
  xcodeVersion: "2600"

configs:
  Debug: debug
  Release: release

# MARKETING_VERSION and CURRENT_PROJECT_VERSION come from version.txt, written
# by `apple:project`. Beam ships as one product with one version (ADR-0009), so
# there is nothing here to keep in step by hand.
configFiles:
  Debug: Version.xcconfig
  Release: Version.xcconfig

packages:
  BeamKit:
    path: Packages/BeamKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES
    DEAD_CODE_STRIPPING: YES
    # No signing identity is assumed: CI has none, and a contributor should not
    # need an Apple Developer account to check that the app compiles.
    CODE_SIGN_STYLE: Automatic

targets:
  Beam-iOS:
    type: application
    platform: iOS
    sources:
      - path: Apps/Shared
      - path: Apps/iOS
        excludes: ["Info.plist"]
        optional: true
    # Declared here rather than in a committed Info.plist. XcodeGen *generates*
    # the file at `info.path` and overwrites whatever is there, so a
    # hand-written plist beside this is silently replaced by a stub the first
    # time anyone runs `apple:project` -- which is exactly what happened, and
    # it cost background audio and the ATS exception with no diff to show for
    # it. The generated file is gitignored; this is the source of truth.
    info:
      path: Apps/iOS/Info.plist
      properties:
        # Both come from version.txt via Version.xcconfig, so the single
        # product version of ADR-0009 reaches the bundle. Without them Xcode
        # defaults to 1.0/1 and every build carries the same version -- the
        # second App Store upload is then rejected for a non-increasing
        # CFBundleVersion.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Playback continues with the screen locked. Without this the system
        # stops the session the moment the app leaves the screen, which reads
        # as a crash rather than as a policy.
        UIBackgroundModes: [audio, fetch]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # A self-hosted server on a LAN is routinely plain HTTP with no
        # resolvable name, so App Transport Security has to permit it. Scoped
        # to local networking rather than opened wholesale: an arbitrary HTTP
        # host on the internet is still refused.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Beam connects to your media server on this network.
    dependencies:
      - package: BeamKit
        product: BeamAppShell
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.justinchung.beam
        PRODUCT_NAME: Beam
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO

  Beam-macOS:
    type: application
    platform: macOS
    sources:
      - path: Apps/Shared
      - path: Apps/macOS
        excludes: ["Info.plist", "Beam.entitlements"]
        optional: true
    info:
      path: Apps/macOS/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.entertainment
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Beam connects to your media server on this network.
    # Generated too, and for the same reason -- a committed entitlements file
    # is overwritten with an empty `<dict/>`, which under the sandbox leaves
    # the app unable to open a single outbound connection.
    entitlements:
      path: Apps/macOS/Beam.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # Outgoing only: Beam reaches a server, and nothing reaches Beam.
        com.apple.security.network.client: true
    dependencies:
      - package: BeamKit
        product: BeamAppShell
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.justinchung.beam
        PRODUCT_NAME: Beam

schemes:
  Beam (iOS):
    build:
      targets:
        Beam-iOS: all
    run:
      config: Debug
    archive:
      config: Release

  Beam (macOS):
    build:
      targets:
        Beam-macOS: all
    run:
      config: Debug
    archive:
      config: Release
