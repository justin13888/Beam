# Dev-only Dex config (see ADR-0003 and docs/operations/deployment.md).
# Static users + a single static client -- no real user data, safe to commit.
#
# Enabled only by the `dev-idp` compose profile; `mise run dev:up` is the
# supported entry point. Beam itself is bring-your-own-IdP (FR-101).

# `dex.beam.localhost` rather than `localhost` so that one issuer string works
# from the browser, from inside the beam-server container, and from a host-run
# `cargo run -p beam-server` (#73). openidconnect requires the discovery
# document's `issuer` to equal the configured BEAM_OIDC_ISSUER exactly, so the
# browser-visible and server-visible URLs cannot differ. The name resolves to
# loopback on the host per RFC 6761 and to the dex container through compose
# DNS via the network alias in compose.dependencies.yaml. If
# `curl http://dex.beam.localhost:5556/dex/.well-known/openid-configuration`
# fails to resolve on your host, add `127.0.0.1 dex.beam.localhost` to
# /etc/hosts.
issuer: http://dex.beam.localhost:5556/dex

storage:
  type: sqlite3
  config:
    file: /var/dex/dex.db

web:
  http: 0.0.0.0:5556

staticClients:
  - id: beam
    secret: beam-dev-secret
    name: "Beam"
    redirectURIs:
      - "http://localhost:8000/v1/auth/callback"
      # Dex's own step in the device authorization grant (ADR-0017): after a
      # user enters the code at /dex/device, Dex completes an internal
      # authorization-code round-trip to this relative URI, which it matches
      # literally. Without it a device login cannot be approved -- Dex
      # answers "Unregistered redirect_uri".
      #
      # Known Dex bug (dexidp/dex#4571, open against v2.44+, seen on v2.45.1):
      # with the issuer on a sub-path, as here (/dex), Dex redirects the
      # approving browser to /device/callback without the /dex prefix, which
      # 404s. Approving a dev device login in a browser therefore needs the
      # address bar edited to /dex/device/callback?... once; Beam's side of
      # the flow is unaffected.
      #
      # Known Dex limit (ADR-0017 D151-9): Dex's device endpoint reads the
      # client secret from the form only. Sent HTTP Basic, it records an empty
      # secret and approval fails at /dex/device/callback with "Invalid client
      # credentials.". `mise run dev:up` therefore runs Beam with
      # BEAM_OIDC_CLIENT_AUTH_METHOD=client_secret_post against this Dex; a
      # host-run server pointed here needs the same.
      - "/device/callback"

enablePasswordDB: true
staticPasswords:
  # Both use the password "password". The hash below is bcrypt cost 10; if
  # it doesn't work with your Dex build, regenerate it with:
  #   echo -n password | htpasswd -BinC 10 admin | cut -d: -f2
  #
  # Admin is derived solely from an IdP-asserted claim (FR-106). Only `admin`
  # carries the `beam-admin` group, so `user` is a genuine non-admin for
  # exercising the admin guards; `mise run dev:up` points BEAM_OIDC_ADMIN_CLAIM
  # at `groups` and requests the `groups` scope, without which Dex leaves the
  # claim out of the ID token. Static-user `groups` needs Dex v2.45.0+
  # (dexidp/dex#4456); compose.dependencies.yaml pins a version that has it.
  - email: "admin@beam.localhost"
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
    username: "admin"
    userID: "08a8684b-db88-4b73-90a9-3cd1661f5466"
    groups: ["beam-admin"]
  - email: "user@beam.localhost"
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
    username: "user"
    userID: "08a8684b-db88-4b73-90a9-3cd1661f5467"

oauth2:
  skipApprovalScreen: true
