[package]
name = "beam-domain"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
mutants = { workspace = true }
num = { version = "0.4.3", features = ["serde"] }
parking_lot = "0.12.5"
regex = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
# `RealClock::sleep` needs `tokio::time`; `TestClock`'s waiters need `tokio::sync`.
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }

[dependencies.beam-entity]
path = "../beam-entity"
optional = true

[dependencies.mockall]
version = "0.15.0"
optional = true

[dev-dependencies]
# Also a `test-utils`-gated optional dependency above. Listed here too so this
# crate's own `#[cfg(test)]` build works standalone (`cargo test -p
# beam-domain`) instead of only when a workspace build happens to unify the
# feature in from a downstream crate's dev-dependencies -- which is what
# cargo-mutants does when it builds each package on its own.
mockall = "0.15.0"
proptest = "1.11.0"
tempfile = "3.27.0"
tokio = { workspace = true, features = ["macros", "rt"] }

[features]
entity = ["dep:beam-entity"]
# The feature set cargo-mutants builds this package with.
#
# cargo-mutants builds each package on its own, so it needs one *unqualified*
# feature name that is valid everywhere -- and the set it selects has to compile
# every `cfg`-gated production path, or mutants in code that was never built are
# reported MISSED for a reason that has nothing to do with the tests.
mutation-testing = ["entity", "test-utils"]
test-utils = ["dep:mockall"]
