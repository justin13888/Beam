apiVersion: v2
name: beam
description: >-
  Beam media server on Kubernetes: one beam-server pod against an external
  PostgreSQL, media libraries mounted read-only, and an optional web client.
type: application
# Both versions are the release version, written by release-please
# (release-please-config.json, extra-files) -- never edit them by hand. The
# generic updater rewrites the version on each line carrying the marker and
# leaves the rest of the file alone; the yaml updater would re-serialise it
# and drop these comments.
version: 0.1.0 # x-release-please-version
appVersion: "0.1.0" # x-release-please-version
# startupProbe, seccompProfile and fsGroupChangePolicy are all GA well before
# this; 1.29 is the oldest release still inside upstream's support window when
# the chart was written. `helm:template` (mise.toml) runs kubeconform against
# this floor and against a current release, 1.29.0 and 1.37.0; raise its
# `for kube in` list with this line.
kubeVersion: ">=1.29.0-0"
home: https://github.com/justin13888/beam
sources:
  - https://github.com/justin13888/beam
keywords:
  - media
  - media-server
  - streaming
