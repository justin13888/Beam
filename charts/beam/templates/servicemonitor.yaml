{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled }}
{{- $monitor := .Values.metrics.serviceMonitor }}
# Scrapes /metrics through the server Service, which the Prometheus Operator
# turns into targets labelled with this namespace and the Service's name --
# the two labels every alert in prometheusrule.yaml selects on.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "beam.fullname" . }}
  labels:
    {{- include "beam.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
    {{- with $monitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      {{- include "beam.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ $monitor.interval }}
      {{- with $monitor.scrapeTimeout }}
      scrapeTimeout: {{ . }}
      {{- end }}
      {{- with $monitor.relabelings }}
      relabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $monitor.metricRelabelings }}
      metricRelabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
