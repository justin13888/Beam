{{- /*
Only for secrets given inline. An existingSecret is referenced directly, and
the chart creates nothing when every secret comes from one.
*/}}
{{- $inline := dict }}
{{- if and .Values.database.url (not .Values.database.existingSecret) }}
{{- $_ := set $inline "database-url" .Values.database.url }}
{{- end }}
{{- if and .Values.oidc.clientSecret (not .Values.oidc.existingSecret) }}
{{- $_ := set $inline "oidc-client-secret" .Values.oidc.clientSecret }}
{{- end }}
{{- if and .Values.tmdb.apiToken (not .Values.tmdb.existingSecret) }}
{{- $_ := set $inline "tmdb-api-token" .Values.tmdb.apiToken }}
{{- end }}
{{- if $inline }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "beam.secretName" . }}
  labels:
    {{- include "beam.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key, $value := $inline }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
{{- end }}
