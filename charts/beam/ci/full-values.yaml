# Every optional server feature on, secrets from existing Secrets, and one
# library of each source kind the chart forces read-only plus one it cannot.
server:
  publicUrl: https://beam.example.test
  extraAllowedOrigins:
    - https://other.example.test
  cookieSecure: true
  logLevel: beam_server=debug
  env:
    BEAM_SCAN_INTERVAL_SECS: "600"
database:
  existingSecret: beam-database
oidc:
  issuer: https://idp.example.test/realms/beam
  clientId: beam
  existingSecret: beam-oidc
  adminClaim: groups
  adminValue: beam-admin
tmdb:
  existingSecret: beam-tmdb
libraries:
  - name: movies
    volume:
      persistentVolumeClaim:
        claimName: media-movies
  - name: anime
    volume:
      nfs:
        server: nas.example.test
        path: /export/anime
  - name: local
    volume:
      hostPath:
        path: /srv/media/local
        type: Directory
persistence:
  data:
    existingClaim: beam-data
ingress:
  enabled: true
  className: nginx
  host: beam.example.test
  tls:
    secretName: beam-tls
metrics:
  enabled: true
imagePullSecrets:
  - name: ghcr
