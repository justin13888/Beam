# Every optional server feature on, secrets from existing Secrets, media
# readable through a supplemental group, and libraries on three source kinds
# the chart forces read-only (a claim, NFS and a CSI driver) plus two
# hostPaths, which have no readOnly field and whose type the chart pins to
# Directory -- one opting in to HostToContainer mount propagation, one not --
# and every watcher and settle value moved off its default.
server:
  publicUrl: https://beam.example.test
  podSecurityContext:
    supplementalGroups:
      - 1500
  extraAllowedOrigins:
    - https://other.example.test
  cookieSecure: true
  shutdownTimeoutSeconds: 120
  logLevel: beam_server=debug
  env:
    BEAM_SCAN_INTERVAL_SECS: "600"
database:
  existingSecret: beam-database
oidc:
  issuer: https://idp.example.test/realms/beam
  clientId: beam
  existingSecret: beam-oidc
  clientAuthMethod: client_secret_post
  adminClaim: groups
  adminValue: beam-admin
tmdb:
  existingSecret: beam-tmdb
tvdb:
  existingSecret: beam-tvdb
telemetry:
  existingSecret: beam-telemetry
libraries:
  - name: movies
    volume:
      persistentVolumeClaim:
        claimName: media-movies
  - name: anime
    volume:
      nfs:
        server: nas.example.test
        path: /export/anime
  - name: shows
    volume:
      csi:
        driver: smb.csi.k8s.io
        volumeAttributes:
          source: //nas.example.test/shows
        nodePublishSecretRef:
          name: smb-credentials
  - name: local
    mountPropagation: HostToContainer
    volume:
      hostPath:
        path: /srv/media/local
  - name: archive
    volume:
      hostPath:
        path: /srv/media/archive
watch:
  # A million or more, which Helm reads as a float and would render as
  # "1e+06" unless the chart converts it to an integer first.
  pollIntervalSeconds: 1000000
  debounceMs: 500
scan:
  settleSeconds: 10
persistence:
  data:
    existingClaim: beam-data
ingress:
  enabled: true
  className: nginx
  host: beam.example.test
  tls:
    secretName: beam-tls
metrics:
  enabled: true
imagePullSecrets:
  - name: ghcr
