[package]
name = "beam-auth"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[features]
default = ["server"]
utils = [
    "dep:argon2",
    "dep:async-trait",
    "dep:base64",
    "dep:beam-entity",
    "dep:chrono",
    "dep:jsonwebtoken",
    "dep:rand",
    "dep:sea-orm",
    "dep:serde",
    "dep:serde_json",
    "dep:sha2",
    "dep:thiserror",
    "dep:tracing",
    "dep:uuid",
]
# Real OIDC discovery/exchange via the `openidconnect` crate. Split out from
# `utils` because it pulls in reqwest + a real HTTP client -- tests that only
# need `FakeOidcClient` (under `test-utils`) don't need this.
oidc = [
    "utils",
    "dep:openidconnect",
    "dep:reqwest",
]
server = [
    "utils",
    "oidc",
    "dep:salvo",
]
test-utils = ["utils"]

[dependencies]
# Non-optional: always compiled (needed by server/routes.rs and #[tokio::test]s)
http = { workspace = true }
tokio = { workspace = true }

# Optional: feature-gated
argon2 = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
base64 = { version = "0.22.1", optional = true }
beam-entity = { path = "../beam-entity", optional = true }
chrono = { workspace = true, features = ["serde"], optional = true }
jsonwebtoken = { workspace = true, optional = true }
openidconnect = { version = "4.0.1", optional = true }
rand = { workspace = true, optional = true }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
], optional = true }
salvo = { workspace = true, optional = true }
sea-orm = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tracing = { workspace = true, features = ["log"], optional = true }
uuid = { workspace = true, optional = true }
