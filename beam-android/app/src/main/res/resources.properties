# The locale the unqualified `values/` resources are written in. AGP 9 requires
# this to generate the per-app language list, and without it the build fails
# outright rather than assuming a default.
#
# Beam ships English only for now. Adding `values-<locale>/` directories is all
# that is needed for the system's per-app language picker to offer them.
unqualifiedResLocale=en-US
