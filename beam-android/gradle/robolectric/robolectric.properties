# Robolectric runs the unit tests against API 36, not the app's targetSdk of 37.
#
# Robolectric ships a preinstrumented Android jar per API level, and 4.16.1's
# newest is 36. Left alone it refuses to start at all --
# "Package targetSdkVersion=37 > maxSdkVersion=36" -- so this is not a
# preference but the newest level that can currently run.
#
# The gap matters for exactly one thing: behaviour gated on
# `Build.VERSION.SDK_INT >= 37` is not exercised here. Nothing in the app is
# yet, and anything added must be covered on a device instead until Robolectric
# catches up. Raise this the moment an API 37 image ships.
sdk=36
