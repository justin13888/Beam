[package]
name = "beam-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
default-run = "beam-server"

[dependencies]
beam-auth = { path = "../beam-auth", features = ["utils", "oidc"] }
beam-domain = { path = "../beam-domain" }
beam-entity = { path = "../beam-entity" }
beam-index = { path = "../beam-index" }
beam-migration = { path = "../beam-migration" }
# Only for the enrichment-provider decision's error type; the client itself is
# built by beam-index.
cameo = { version = "0.2.0", default-features = false, features = ["tmdb", "anilist"] }
http = { workspace = true }
async-stream = "0.3"
async-trait = { workspace = true }
# The browse cursor is base64url JSON (services/cursor.rs).
base64 = "0.23.1"
bytes = "1"
chrono = { workspace = true, features = ["serde"] }
color-eyre = "0.6.5"
confique = { workspace = true }
dotenvy = "0.15.7"
eyre = "0.6.14"
# `Sse` is generic over `futures_core::Stream`, which kynos 0.4.0 does not
# re-export: getkono/kynos#1116. Drop this once a release re-exports it.
futures-core = { workspace = true }
# Artwork size variants (issue #266): decode, downscale and re-encode a cached
# poster once per size. Pure-Rust codecs only -- no system libraries -- and
# only the formats providers actually serve posters in; AVIF and GIF are
# served at their original size rather than pulling in a C AV1 decoder.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
kynos = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
mutants = { workspace = true }
rand = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = "3.27.0"
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true, features = ["log", "release_max_level_debug"] }
tracing-subscriber = { workspace = true, features = ["json", "env-filter"] }
uuid = { workspace = true }

[dev-dependencies]
futures = "0.3.34"
# Adds the in-process `TestClient` and the contract-conformance assertions.
kynos = { workspace = true, features = ["test-util"] }
beam-auth = { path = "../beam-auth", features = ["test-utils"] }
beam-domain = { path = "../beam-domain", features = ["test-utils"] }
beam-index = { path = "../beam-index", features = ["test-utils"] }
metrics-util = { workspace = true }
mockall = "0.15.0"
# The harness of the opt-in `e2e-server` tier (tests/e2e_server.rs). An empty
# library unless that feature is on.
beam-test-support = { path = "../beam-test-support" }
proptest = "1.11.0"

# A FIFO put in a subtitle file's place, which delivery must refuse without
# waiting on it. Already in the tree through beam-index.
[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { version = "1.1", features = ["fs"] }

[features]
test-utils = ["beam-domain/test-utils", "beam-index/test-utils"]
# The server end-to-end tier (#191): `tests/e2e_server.rs` against a composed
# Postgres and Dex. Off by default so `cargo test --workspace` needs no
# infrastructure (NFR-201); `mise run e2e:server` turns it on.
e2e-server = ["beam-test-support/e2e-server"]
vendored-ffmpeg = ["beam-index/vendored-ffmpeg"]
# The feature set cargo-mutants builds this package with.
#
# cargo-mutants builds each package on its own, so it needs one *unqualified*
# feature name that is valid everywhere -- and the set it selects has to compile
# every `cfg`-gated production path, or mutants in code that was never built are
# reported MISSED for a reason that has nothing to do with the tests.
mutation-testing = ["vendored-ffmpeg", "test-utils"]
