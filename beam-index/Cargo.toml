[package]
name = "beam-index"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
beam-domain = { path = "../beam-domain", features = ["entity"] }
beam-entity = { path = "../beam-entity" }
async-trait = { workspace = true }
# `cache` (rusqlite, bundled) is deliberately left disabled: it pins
# libsqlite3-sys to a version range that hard-conflicts with the one
# sea-orm-migration's CLI tooling (via sqlx-sqlite, always compiled in
# regardless of our postgres-only sea-orm feature selection) pins. See
# docs/architecture/decisions/ADR-0006-cameo-enrichment.md.
cameo = { version = "0.2.0", default-features = false, features = ["tmdb", "anilist"] }
chrono = { workspace = true, features = ["serde"] }
ffmpeg-next = { workspace = true }
# Facade only: every counter is a no-op unless beam-server installed a
# recorder (BEAM_ENABLE_METRICS=true).
metrics = { workspace = true }
mutants = { workspace = true }
notify = "8"
num = { version = "0.4.3", features = ["serde"] }
num_cpus = "1.17.0"
parking_lot = "0.12.5"
rayon = "1.12.0"
regex = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
walkdir = { workspace = true }
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }

[dev-dependencies]
# `test-utils` here (not just under the crate's own `test-utils` feature) so the
# domain-level doubles -- `TestClock`, builders -- are available to this crate's
# own `#[cfg(test)]` modules: a dependency is not compiled with `cfg(test)`.
beam-domain = { path = "../beam-domain", features = ["entity", "test-utils"] }
beam-test-support = { path = "../beam-test-support" }
futures = "0.3.34"
metrics-util = { workspace = true }
mockall = "0.15.0"
sea-orm = { workspace = true, features = ["mock"] }
tempfile = "3.27.0"

[features]
# Opt-in tier: runs the shared repository contracts against a real Postgres.
# Never enabled by `rust:test`, `rust:coverage`, `mise run ci`, or the pre-push
# hook -- see NFR-201 and ADR-0011.
pg-integration = ["beam-test-support/pg-integration"]
test-utils = ["dep:mockall", "beam-domain/test-utils"]
vendored-ffmpeg = ["ffmpeg-next/build"]
# The feature set cargo-mutants builds this package with.
#
# cargo-mutants builds each package on its own, so it needs one *unqualified*
# feature name that is valid everywhere -- and the set it selects has to compile
# every `cfg`-gated production path, or mutants in code that was never built are
# reported MISSED for a reason that has nothing to do with the tests.
mutation-testing = ["vendored-ffmpeg", "test-utils"]

[dependencies.mockall]
version = "0.15.0"
optional = true
