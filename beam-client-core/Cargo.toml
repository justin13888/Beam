[package]
name = "beam-client-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# "lib" alongside "cdylib" is load-bearing: without it `cargo test` and
# `cargo llvm-cov` cannot link the crate, so the workspace gates would skip it.
#
# "staticlib" is what the Apple client links (#66). An XCFramework embedding a
# dynamic library has to be code-signed and copied into the app bundle at build
# time; a static one is just an archive the linker consumes, which is both the
# UniFFI convention and one less thing to get wrong per target. Android keeps
# using the cdylib, because a JNI library must be loadable by `System.loadLibrary`.
crate-type = ["cdylib", "staticlib", "lib"]

# The runtime dependency contract the generated client requires. spargen audits
# this manifest against its tested floors and fails with E023 before rustc runs,
# so these versions are not free-floating -- see `spargen deps`.
[dependencies]
bytes = "1.12.1"
secrecy = "0.10.3"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
time = { version = "0.3.55", features = ["formatting", "parsing", "serde"] }

# Core-owned dependencies, beyond the generated client's contract above.
async-trait = { workspace = true }
base64 = "0.23.1"
# The Matroska demuxer behind `crate::demux`. Pure Rust with no dependencies of
# its own, which is what makes it viable in a static library that has to link
# into an iOS app -- and permissively licensed (Zlib OR MIT OR Apache-2.0), so
# it needs no `deny.toml` exception.
matroska-demuxer = "0.8.1"
# Provides `#[mutants::skip]` for the test-only doubles; see the workspace
# manifest and `mise run check:mutants-skip-fakes` for why they need it.
mutants = { workspace = true }
# rustls is configured directly rather than through reqwest's bundled roots:
# a self-hosted server on a LAN needs a trust-on-first-use exception, and that
# is a `ServerCertVerifier`, which reqwest exposes only via a preconfigured
# `ClientConfig`. See `src/tls.rs`.
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = { workspace = true }
thiserror = { workspace = true }
webpki-roots = "1.0.9"
x509-parser = "0.18.1"
tracing = { workspace = true }
# Only the `rt` feature: the core needs `JoinSet` to fan out the metadata
# lookups the playback endpoints force (they return bare identifiers), and
# nothing else. `full` would put a multi-threaded scheduler, process and signal
# handling into an Android `.so` that already runs on the platform's runtime.
tokio = { version = "1.53.1", default-features = false, features = ["rt"] }
uniffi = { version = "0.32", features = ["tokio"] }
url = "2.5.8"

# rustls with `ring`, deliberately not `aws-lc-rs`: aws-lc-rs needs cmake and a
# per-ABI C toolchain, which does not cross-compile cleanly to Android.
#
# Held at 0.12 for that reason. reqwest 0.13 collapsed the TLS feature matrix
# and dropped `rustls-tls-manual-roots-no-provider`; its replacements are
# `rustls` (which forces aws-lc-rs) and `rustls-no-provider` (which pulls
# `rustls-platform-verifier`, the thing `src/tls.rs` exists to replace with a
# trust-on-first-use `ServerCertVerifier`). Neither is usable here.
[dependencies.reqwest]
version = "0.12.28"
default-features = false
features = ["charset", "http2", "json", "rustls-tls-manual-roots-no-provider"]

[build-dependencies]
spargen = "0.4.0"

[dev-dependencies]
# Real certificates, so the trust tests exercise the actual DER parsing and
# digest rather than a hand-built struct that cannot disagree with reality.
rcgen = "0.14.10"
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

# The bindgen entry point ships as a bin so the Kotlin bindings are always
# generated by the same crate version that produced the `.so`, with no
# separately pinned tool to drift from it.
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["uniffi-bindgen"]

[features]
uniffi-bindgen = ["uniffi/cli"]
# Exposes the in-memory fakes to other crates, matching the convention the
# rest of the workspace already uses.
test-utils = []
