version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      cargo-patch-minor:
        update-types:
          - "patch"
          - "minor"
    open-pull-requests-limit: 10

  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      bun-patch-minor:
        update-types:
          - "patch"
          - "minor"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-patch-minor:
        update-types:
          - "patch"
          - "minor"
    open-pull-requests-limit: 10

  # beam-android resolves through gradle/libs.versions.toml. Without this
  # ecosystem the catalog drifts silently -- the cargo, bun and github-actions
  # entries above never see it.
  - package-ecosystem: "gradle"
    directory: "/beam-android"
    schedule:
      interval: "weekly"
    groups:
      gradle-patch-minor:
        update-types:
          - "patch"
          - "minor"
    open-pull-requests-limit: 10
