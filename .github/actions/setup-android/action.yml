name: Set up Android
description: >
  Install the Android SDK and NDK a JVM-only build needs, and cache them.

# The emulator and its system image are not installed: `android:sdk` leaves
# them to `android:avd`. The Android CI jobs never boot a device -- an emulator
# needs nested virtualisation that hosted runners do not reliably provide, and
# the screenshot tests run under Robolectric on the JVM instead.
#
# Requires jdx/mise-action to have run first: the SDK location comes from
# mise.toml.

runs:
  using: composite
  steps:
    # Read from mise rather than restated, so the cache below covers exactly the
    # directory `mise run android:sdk` populates and every `mise run android:*`
    # builds against. mise.toml owns the location and ignores an ambient
    # ANDROID_HOME, so exporting one here would change nothing.
    - name: Resolve the SDK location
      id: sdk
      shell: bash
      run: echo "root=$(mise env --json | jq -r .ANDROID_SDK_ROOT)" >> "$GITHUB_OUTPUT"

    - name: Restore the SDK
      id: cache
      uses: actions/cache@v6
      with:
        path: ${{ steps.sdk.outputs.root }}
        # Keyed on mise.toml because that is where the package coordinates and
        # the NDK pin live; changing either must not silently reuse the old
        # SDK.
        key: android-sdk-${{ runner.os }}-${{ hashFiles('mise.toml') }}

    # Unconditional: on a cache hit it finds every package already present and
    # exits without touching the network, and on a partial restore it installs
    # only what is missing. The Gradle tasks depend on it anyway; running it
    # here keeps the download out of the first build step's timing.
    - name: Install the SDK
      shell: bash
      run: mise run android:sdk

    # The Rust core cross-compiles to the Android ABIs, and the Kotlin bindings
    # are generated from the built library rather than from source.
    - name: Add the Android Rust targets
      shell: bash
      run: |
        rustup target add \
          aarch64-linux-android \
          armv7-linux-androideabi \
          x86_64-linux-android
