name: Setup FFmpeg
description: >
  Builds FFmpeg 8.1 from source if not cached, restores from cache if available,
  and configures PKG_CONFIG_PATH / LD_LIBRARY_PATH / PATH for the job. Kept in
  lockstep with the `ffmpeg-next` version pinned in the workspace Cargo.toml.

runs:
  using: composite
  steps:
    # The key includes the runner image version. This build is `--enable-shared`
    # against the image's own libx264/libx265/libvpx/libass/openssl, so a cached
    # /opt/ffmpeg is only valid for the image it was built on. When the image
    # updates those .so files underneath a restored cache, the result is not a
    # build failure but a SIGSEGV the first time anything decodes -- ffprobe
    # keeps demuxing happily, which makes it look like the caller's bug.
    - name: Cache FFmpeg 8.1 build
      id: cache-ffmpeg
      uses: actions/cache@v4
      with:
        path: /opt/ffmpeg
        key: ffmpeg-8.1-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageVersion }}-v2

    - name: Install FFmpeg build dependencies
      if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
      uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: >-
          build-essential pkg-config yasm nasm wget ca-certificates
          libx264-dev libx265-dev libvpx-dev
          libopus-dev libass-dev libfreetype-dev libfontconfig-dev
          libfribidi-dev libogg-dev libssl-dev
        version: 1.0

    - name: Build FFmpeg 8.1 from source
      if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p /tmp/ffmpeg && cd /tmp/ffmpeg
        wget -q https://ffmpeg.org/releases/ffmpeg-8.1.tar.xz
        tar xf ffmpeg-8.1.tar.xz
        cd ffmpeg-8.1
        ./configure \
          --prefix=/opt/ffmpeg \
          --disable-debug \
          --disable-doc \
          --disable-ffplay \
          --enable-shared \
          --disable-static \
          --enable-gpl \
          --enable-version3 \
          --enable-fontconfig \
          --enable-libass \
          --enable-libfontconfig \
          --enable-libfreetype \
          --enable-libfribidi \
          --enable-libopus \
          --enable-libvpx \
          --enable-libx264 \
          --enable-libx265 \
          --enable-openssl \
          --enable-small \
          --extra-cflags="-I/opt/ffmpeg/include" \
          --extra-ldflags="-L/opt/ffmpeg/lib" \
          --extra-libs=-lpthread \
          --extra-libs=-lm
        make -j$(nproc)
        make install

    - name: Configure FFmpeg environment
      shell: bash
      run: |
        echo "PKG_CONFIG_PATH=/opt/ffmpeg/lib/pkgconfig" >> $GITHUB_ENV
        echo "LD_LIBRARY_PATH=/opt/ffmpeg/lib:/usr/lib/aarch64-linux-gnu:/usr/lib/x86_64-linux-gnu" >> $GITHUB_ENV
        echo "/opt/ffmpeg/bin" >> $GITHUB_PATH
