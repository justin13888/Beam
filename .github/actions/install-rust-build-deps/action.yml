name: Install Rust Build Dependencies
description: Installs apt packages required to build Rust crates with media/FFmpeg support

runs:
  using: composite
  steps:
    # Plain apt-get for the same reason as setup-ffmpeg (#196):
    # awalsh128/cache-apt-pkgs-action@v1.6.3 never refreshes the package index
    # on a hosted runner, so a superseded version 404s on a cache miss.
    - name: Install build dependencies
      shell: bash
      run: |
        sudo apt-get -o Acquire::Retries=3 update
        sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y \
          build-essential pkg-config \
          clang libclang-dev \
          protobuf-compiler \
          libx264-dev libx265-dev libvpx-dev \
          libopus-dev libass-dev libfreetype-dev libfontconfig-dev \
          libfribidi-dev libogg-dev libssl-dev
