# Local dev/test aliases that statically compile a vendored, LGPL-only
# FFmpeg from source (via ffmpeg-sys-next's `build` feature) instead of
# dynamically linking a system installation. Use these when the host lacks
# FFmpeg development libraries (.pc files). CI and container builds keep
# dynamically linking system FFmpeg and do not use these aliases.
[alias]
t-local = ["test", "--workspace", "--features", "beam-index/vendored-ffmpeg,beam-stream/vendored-ffmpeg"]
clippy-local = ["clippy", "--workspace", "--all-targets", "--features", "beam-index/vendored-ffmpeg,beam-stream/vendored-ffmpeg", "--", "-D", "warnings"]
build-local = ["build", "--workspace", "--features", "beam-index/vendored-ffmpeg,beam-stream/vendored-ffmpeg"]
