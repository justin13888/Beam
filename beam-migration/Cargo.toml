[package]
name = "beam-migration"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "beam_migration"
path = "src/lib.rs"

[[bin]]
name = "beam-migration"
path = "src/main.rs"

[dependencies]
argon2 = "0.6.0"
async-trait = { workspace = true }
sea-orm-migration = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# `status` logs through the subscriber sea-orm-migration's CLI installs.
tracing = { workspace = true }

[dev-dependencies]
beam-test-support = { path = "../beam-test-support" }
# `sync` and `time` for the concurrent-migrator test's hand-off and timeout.
tokio = { workspace = true }

[features]
# Opt-in tier: runs the upgrade path against a real Postgres. Never enabled by
# `rust:test`, `rust:coverage`, `mise run ci`, or the pre-push hook (NFR-201).
pg-integration = ["beam-test-support/pg-integration"]
